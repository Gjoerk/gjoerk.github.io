class Board {
  constructor(el, opts) {
    this.el = el;
    this.opts = opts;
    this.orient = 'w';
    this.pieces = new Map();
    this.sel = null;
    this.targets = [];
    this.game = null;
    this.drag = null;
    this.marks = {};
    el.classList.add('board');
    el.innerHTML = '<div class="squares"></div><div class="pieces"></div><svg class="arrows" viewBox="0 0 8 8"></svg><svg class="drawn" viewBox="0 0 8 8" aria-hidden="true"></svg>';
    this.drawnSvg = el.querySelector('.drawn'); this.userMarks = new Set(); this.userArrows = [];
    this.sqLayer = $('.squares', el);
    this.pcLayer = $('.pieces', el);
    this.svg = $('.arrows', el);
    this.cells = [];
    for (let i = 0; i < 64; i++) {
      const d = document.createElement('div');
      d.className = 'sq';
      // Each square shows a different patch of the marble texture, like separate stone tiles.
      d.style.backgroundPosition = `${(i * 37 + 11) % 97}% ${(i * 53 + 29) % 89}%`;
      this.sqLayer.appendChild(d);
      this.cells.push(d);
    }
    this.layout();
    el.addEventListener('pointerdown', e => this.onDown(e));
    el.addEventListener('pointermove', e => this.onPMove(e));
    el.addEventListener('pointerup', e => this.onUp(e));
    el.addEventListener('pointercancel', () => this.cancelDrag());
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  xy(sq) {
    const f = FILES.indexOf(sq[0]), r = +sq[1] - 1;
    return this.orient === 'w' ? { x: f, y: 7 - r } : { x: 7 - f, y: r };
  }
  sqAt(x, y) {
    if (x < 0 || x > 7 || y < 0 || y > 7) return null;
    return this.orient === 'w' ? FILES[x] + (8 - y) : FILES[7 - x] + (y + 1);
  }
  cell(sq) { const { x, y } = this.xy(sq); return this.cells[y * 8 + x]; }
  layout() {
    this.cells.forEach((c, i) => {
      const x = i % 8, y = Math.floor(i / 8);
      const sq = this.sqAt(x, y);
      const f = FILES.indexOf(sq[0]), r = +sq[1] - 1;
      c.className = 'sq' + ((f + r) % 2 === 0 ? ' d' : '');
      c.dataset.sq = sq;
    });
    const w = this.orient === 'w';
    if (this.opts.ranks) this.opts.ranks.innerHTML = [...Array(8)].map((_, y) => `<span>${w ? 8 - y : y + 1}</span>`).join('');
    if (this.opts.files) this.opts.files.innerHTML = [...Array(8)].map((_, x) => `<span>${w ? FILES[x] : FILES[7 - x]}</span>`).join('');
    this.applyMarks();
  }
  setOrientation(o) {
    if (o === this.orient) return;
    this.orient = o;
    this.layout();
    for (const [sq, el] of this.pieces) this.place(el, sq, true);
    this.drawArrows(this.arrowList || []);
    this.renderDrawings && this.renderDrawings();
  }
  place(el, sq, instant) {
    const { x, y } = this.xy(sq);
    if (instant) el.style.transition = 'none';
    el.style.transform = `translate(${x * 100}%, ${y * 100}%)`;
    if (instant) { void el.offsetWidth; el.style.transition = ''; }
  }
  makePiece(code, sq) {
    const el = document.createElement('div');
    el.className = 'pc ' + code;
    el.dataset.code = code;
    this.pcLayer.appendChild(el);
    this.place(el, sq, true);
    return el;
  }
  removePiece(el) {
    el.classList.add('gone');
    setTimeout(() => el.remove(), 220);
  }
  shift(from, to) {
    const el = this.pieces.get(from);
    if (!el) return;
    const cap = this.pieces.get(to);
    if (cap && cap !== el) this.removePiece(cap);
    this.pieces.delete(from);
    this.pieces.set(to, el);
  }
  /** Sync pieces to `game`. `move` (a chess.js move) animates that move; `dragged` drops it in place. */
  setPosition(game, { move, dragged, instant } = {}) {
    this.game = game;
    if (move) {
      this.shift(move.from, move.to);
      const rank = move.from[1];
      if (move.flags.includes('k')) this.shift('h' + rank, 'f' + rank);
      if (move.flags.includes('q')) this.shift('a' + rank, 'd' + rank);
      if (move.flags.includes('e')) {
        const capSq = move.to[0] + move.from[1];
        const el = this.pieces.get(capSq);
        if (el) { this.removePiece(el); this.pieces.delete(capSq); }
      }
    }
    const want = new Map();
    const b = game.board();
    for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
      const p = b[r][f];
      if (p) want.set(FILES[f] + (8 - r), p.color + p.type.toUpperCase());
    }
    for (const [sq, el] of [...this.pieces]) {
      const code = want.get(sq);
      if (!code) { this.removePiece(el); this.pieces.delete(sq); }
      else if (el.dataset.code !== code) { el.className = 'pc ' + code; el.dataset.code = code; }
    }
    for (const [sq, code] of want) if (!this.pieces.has(sq)) this.pieces.set(sq, this.makePiece(code, sq));
    for (const [sq, el] of this.pieces) {
      const wasDrag = el.classList.contains('drag');
      el.classList.remove('drag');
      this.place(el, sq, instant || (wasDrag && dragged) || reduceMotion);
    }
    const last = move ? [move.from, move.to] : null;
    let check = null;
    if (game.in_check()) {
      const turn = game.turn();
      for (const [sq, code] of want) if (code === turn + 'K') check = sq;
    }
    this.clearSel();
    this.mark({ last, check });
  }
  mark(m) { Object.assign(this.marks, m); this.applyMarks(); }
  applyMarks() {
    for (const c of this.cells) c.classList.remove('last', 'check', 'hint', 'sel');
    const m = this.marks;
    if (m.last) m.last.forEach(sq => this.cell(sq).classList.add('last'));
    if (m.check) this.cell(m.check).classList.add('check');
    if (m.hint) this.cell(m.hint).classList.add('hint');
    if (this.sel) this.cell(this.sel).classList.add('sel');
  }
  flash(sq, cls) {
    const c = this.cell(sq);
    c.classList.remove(cls); void c.offsetWidth; c.classList.add(cls);
    setTimeout(() => c.classList.remove(cls), 1100);
  }
  shake() { this.el.classList.remove('shake'); void this.el.offsetWidth; this.el.classList.add('shake'); }
  clearDrawings() { this.userMarks.clear(); this.userArrows = []; this.renderDrawings(); }
  renderDrawings() {
    if (!this.drawnSvg) return;
    let html = '';
    for (const sq of this.userMarks) { const { x, y } = this.xy(sq); html += `<rect x="${x}" y="${y}" width="1" height="1" fill="rgba(235,70,60,.55)"/>`; }
    const col = 'rgba(235,95,60,.85)', w = .17;
    const head = (x2, y2, ux, uy) => { const hb = .44, bx = x2 - ux * hb, by = y2 - uy * hb, nx = -uy, ny = ux; return { bx, by, poly: `<polygon points="${x2},${y2} ${bx + nx * .26},${by + ny * .26} ${bx - nx * .26},${by - ny * .26}" fill="${col}"/>` }; };
    for (const a of this.userArrows) {
      const p = this.xy(a.from), q = this.xy(a.to);
      const x1 = p.x + .5, y1 = p.y + .5, x2 = q.x + .5, y2 = q.y + .5, dx = x2 - x1, dy = y2 - y1;
      if ((Math.abs(dx) === 1 && Math.abs(dy) === 2) || (Math.abs(dx) === 2 && Math.abs(dy) === 1)) {
        // knight move: go two squares straight, then turn 90 degrees for the last square
        const cx = Math.abs(dy) === 2 ? x1 : x2, cy = Math.abs(dy) === 2 ? y2 : y1;
        const ux = Math.sign(x2 - cx), uy = Math.sign(y2 - cy), sx = Math.sign(cx - x1), sy = Math.sign(cy - y1);
        const h = head(x2, y2, ux, uy);
        html += `<path d="M${x1 + sx * .2} ${y1 + sy * .2} L${cx} ${cy} L${h.bx} ${h.by}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>${h.poly}`;
        continue;
      }
      const L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, h = head(x2, y2, ux, uy);
      html += `<line x1="${x1 + ux * .2}" y1="${y1 + uy * .2}" x2="${h.bx}" y2="${h.by}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>${h.poly}`;
    }
    this.drawnSvg.innerHTML = html;
  }
  setArrows(list) { this.arrowList = list; this.drawArrows(list); }
  drawArrows(list) {
    const colors = { green: 'rgba(21,120,27,.82)', blue: 'rgba(30,100,210,.72)', gold: 'rgba(222,150,0,.9)', red: 'rgba(200,40,30,.8)', ghost: 'rgba(30,100,210,.4)' };
    this.svg.innerHTML = list.map(a => {
      const p = this.xy(a.from), q = this.xy(a.to);
      const x1 = p.x + 0.5, y1 = p.y + 0.5, x2 = q.x + 0.5, y2 = q.y + 0.5;
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
      const head = 0.42, w = a.w || 0.17;
      const bx = x2 - ux * head, by = y2 - uy * head;
      const nx = -uy, ny = ux;
      const col = colors[a.color] || a.color;
      return `<line x1="${x1 + ux * 0.18}" y1="${y1 + uy * 0.18}" x2="${bx}" y2="${by}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>` +
        `<polygon points="${x2},${y2} ${bx + nx * 0.24},${by + ny * 0.24} ${bx - nx * 0.24},${by - ny * 0.24}" fill="${col}"/>`;
    }).join('');
  }
  floatText(sq, text) {
    const { x, y } = this.xy(sq);
    const el = document.createElement('div');
    el.className = 'float-xp';
    el.textContent = text;
    el.style.left = `${(x + 0.5) * 12.5}%`;
    el.style.top = `${y * 12.5}%`;
    this.el.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }
  pointSq(e) {
    const r = this.el.getBoundingClientRect();
    return this.sqAt(Math.floor((e.clientX - r.left) / r.width * 8), Math.floor((e.clientY - r.top) / r.height * 8));
  }
  select(sq) {
    this.clearSel();
    this.sel = sq;
    this.targets = this.game ? this.game.moves({ square: sq, verbose: true }).map(m => m.to) : [];
    for (const t of this.targets) {
      const d = document.createElement('i');
      d.className = this.pieces.has(t) ? 'ring2' : 'dot';
      this.cell(t).appendChild(d);
    }
    this.applyMarks();
  }
  clearSel() {
    this.sel = null;
    this.targets = [];
    for (const c of this.cells) c.querySelectorAll('.dot,.ring2').forEach(n => n.remove());
    this.applyMarks();
  }
  onDown(e) {
    if (e.button === 2) {
      const sq = this.pointSq(e);
      if (sq) { this.rdrag = sq; try { this.el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
      e.preventDefault();
      return;
    }
    if (e.button > 0) return;
    if (this.userMarks.size || this.userArrows.length) this.clearDrawings();
    Sound.ensure();
    const sq = this.pointSq(e);
    if (!sq) return;
    if (this.sel && this.targets.includes(sq)) {
      const from = this.sel;
      this.clearSel();
      this.opts.onMove(from, sq, false);
      return;
    }
    if (this.opts.canPick(sq)) {
      const already = this.sel === sq;
      this.select(sq);
      this.drag = { sq, el: this.pieces.get(sq), moved: false, x0: e.clientX, y0: e.clientY, already };
      try { this.el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      e.preventDefault();
    } else this.clearSel();
  }
  onPMove(e) {
    const d = this.drag;
    if (!d || !d.el) return;
    if (!d.moved && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 4) return;
    d.moved = true;
    d.el.classList.add('drag');
    const r = this.el.getBoundingClientRect(), s = r.width / 8;
    d.el.style.transform = `translate(${e.clientX - r.left - s / 2}px, ${e.clientY - r.top - s / 2}px)`;
  }
  onUp(e) {
    if (this.rdrag && e.button === 2) {
      const from = this.rdrag, to = this.pointSq(e);
      this.rdrag = null;
      if (to) {
        if (to === from) { if (this.userMarks.has(from)) this.userMarks.delete(from); else this.userMarks.add(from); }
        else {
          const i = this.userArrows.findIndex(a => a.from === from && a.to === to);
          if (i >= 0) this.userArrows.splice(i, 1); else this.userArrows.push({ from, to });
        }
        this.renderDrawings();
      }
      return;
    }
    const d = this.drag;
    if (!d) return;
    this.drag = null;
    if (!d.moved) { if (d.already) this.clearSel(); return; }
    const sq = this.pointSq(e);
    if (sq && sq !== d.sq && this.targets.includes(sq)) {
      const from = d.sq;
      this.clearSel();
      this.opts.onMove(from, sq, true);
    } else {
      d.el.classList.remove('drag');
      this.place(d.el, d.sq);
      if (sq !== d.sq) this.clearSel();
    }
  }
  cancelDrag() {
    const d = this.drag;
    this.drag = null;
    if (d && d.el) { d.el.classList.remove('drag'); this.place(d.el, d.sq); }
  }
}

function miniBoard(fen, orient = 'w', size) {
  const g = new Chess(fen);
  const b = g.board();
  let html = '';
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const r = orient === 'w' ? y : 7 - y, f = orient === 'w' ? x : 7 - x;
    const p = b[r][f];
    const dark = (f + (7 - r)) % 2 === 0;
    html += `<div class="${dark ? 'd ' : ''}${p ? p.color + p.type.toUpperCase() : ''}"></div>`;
  }
  return `<div class="mini" aria-hidden="true"${size ? ` style="width:${size}px"` : ''}>${html}</div>`;
}

// ---------- engine (Stockfish in a worker) ----------
const Engine = {
  w: null, ready: false, failed: false, busy: false, pending: null, cur: null, lines: [], depth: 0, listeners: new Set(), t: 0,
  start() {
    if (this.w || this.failed) return;
    try {
      const src = "importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');";
      this.w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      this.w.onmessage = e => this.onLine(String(e.data));
      this.w.onerror = () => this.fail();
      this.post('uci');
      this.post('setoption name MultiPV value 3');
      this.post('isready');
      this.watchdog = setTimeout(() => { if (!this.ready) this.fail(); }, 20000);
    } catch (e) { this.fail(); }
  },
  fail() { this.failed = true; this.busy = false; try { this.w && this.w.terminate(); } catch (e) { /* ignore */ } this.emit(true); },
  post(c) { this.w.postMessage(c); },
  analyze(fen) {
    if (!S.settings.engine && !S.settings.evalbar) return;
    this.start();
    if (this.failed) return;
    if (fen === this.cur && (this.busy || this.lines.length)) { this.pending = null; this.emit(!this.busy); return; }
    this.pending = fen;
    if (!this.ready) return;
    if (this.busy) { this.post('stop'); return; }
    this.run();
  },
  run() {
    const fen = this.pending;
    this.pending = null;
    if (!fen) return;
    this.cur = fen; this.lines = []; this.depth = 0; this.busy = true;
    this.post('position fen ' + fen);
    this.post('go depth 18 movetime 2500');
    this.emit(false);
  },
  stop() { this.pending = null; if (this.busy) this.post('stop'); },
  onLine(s) {
    if (s === 'readyok') { this.ready = true; clearTimeout(this.watchdog); if (this.pending) this.run(); return; }
    if (s.startsWith('bestmove')) {
      this.busy = false;
      if (this.pending) this.run(); else this.emit(true);
      return;
    }
    if (!s.startsWith('info') || !s.includes(' pv ') || s.includes('bound')) return;
    const num = k => { const m = s.match(new RegExp(' ' + k + ' (-?\\d+)')); return m ? +m[1] : null; };
    const k = num('multipv') || 1, depth = num('depth'), cp = num('cp'), mate = num('mate');
    const pv = s.split(' pv ')[1].trim().split(/\s+/);
    this.lines[k - 1] = { depth, cp, mate, pv };
    this.depth = Math.max(this.depth, depth || 0);
    const now = Date.now();
    if (now - this.t > 300) { this.t = now; this.emit(false); }
  },
  emit(final) { for (const f of this.listeners) f(final); },
};
// Score from `color`'s point of view, in pawns. Engine scores are from the side to move.
function evalFor(line, fen, color) {
  const stm = fen.split(' ')[1];
  const sign = stm === color ? 1 : -1;
  if (line.mate != null) return { mate: line.mate * sign, v: sign * (line.mate > 0 ? 100 : -100) };
  return { v: (line.cp / 100) * sign };
}
function fmtEval(e) {
  if (e.mate != null) return (e.mate > 0 ? '+M' : '−M') + Math.abs(e.mate);
  const v = e.v;
  return (v > 0.05 ? '+' : v < -0.05 ? '−' : '') + Math.abs(v).toFixed(2);
}
function pvSan(fen, pv, n) {
  const g = new Chess(fen);
  const out = [];
  for (const u of pv.slice(0, n)) { const m = g.move(uciObj(u)); if (!m) break; out.push(m.san); }
  return out;
}

// ---------- confetti, toast ----------
function confetti() {
  if (reduceMotion) return;
  const c = $('#confetti');
  c.hidden = false;
  const ctx = c.getContext('2d');
  const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  const cols = ['#7a9bb6', '#dce6ed', '#ffffff', '#a6c4dc', '#e2c27a', '#4f6f8c'];
  const ps = Array.from({ length: 140 }, () => ({
    x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.35, vx: (Math.random() - 0.5) * 22 * devicePixelRatio,
    vy: (-Math.random() * 18 - 6) * devicePixelRatio, s: (5 + Math.random() * 7) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: cols[Math.floor(Math.random() * cols.length)],
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vy += 0.55 * devicePixelRatio; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66); ctx.restore();
    }
    if (t - t0 < 2200) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
  })(t0);
}
function toast(msg) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ---------- top bar ----------
function renderStats() {
  const dueN = ALL_LINES.filter(l => lineStatus(l.id) === 'due').length;
  const rv = $('#hdrReview'); if (rv) rv.innerHTML = 'Review' + (dueN ? ` <span class="badge">${dueN}</span>` : '');
  const st = $('#stats');
  if (!st) return;
  st.innerHTML = `
    <button class="link" id="soundBtn" aria-pressed="${S.settings.sound}" title="Sound"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/>${S.settings.sound ? '<path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>' : '<path d="m22 9-6 6M16 9l6 6"/>'}</svg></button>`;
  $('#soundBtn').onclick = () => { S.settings.sound = !S.settings.sound; save(); renderStats(); if (S.settings.sound) Sound.play('good'); };
}
function addXP(n, sq) {
  if (n <= 0) return;
  const before = level().L;
  S.xp += n;
  const after = level().L;
  renderStats();
}


// ---------- start page helpers ----------
/** Thumbnail board from a FEN, seen from the side that plays the opening; the defining move is tinted. */
function thumbBoard(fen, side, uci) {
  const rows = fen.split(' ')[0].split('/').map(r => r.replace(/\d/g, n => '.'.repeat(+n)));
  const from = uci.slice(0, 2), to = uci.slice(2, 4);
  let html = '';
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const r = side === 'w' ? y : 7 - y, f = side === 'w' ? x : 7 - x;
    const sq = FILES[f] + (8 - r), ch = rows[r][f];
    const piece = ch === '.' ? '' : (ch === ch.toUpperCase() ? 'w' : 'b') + ch.toUpperCase();
    html += `<i class="${(f + r) % 2 === 1 ? 'd ' : ''}${piece}${sq === from || sq === to ? ' mv' : ''}${sq === to ? ' to' : ''}"></i>`;
  }
  return `<div class="thumb" aria-hidden="true">${html}</div>`;
}
const sigMove = op => { const n = SIG_PLY[op.id] || 4, m = op.lines[0].moves[n - 1]; return { uci: m[1], san: sanAt(n - 1, m[0]) }; };
// Linear-style status ring: dashed = new, half = learning, full = strong, amber = due.
function statusRing(st) {
  const c = { strong: 'var(--sky)', learning: 'var(--fg-3)', due: 'var(--gold)' }[st];
  if (!c) return '<svg class="ring" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--fg-4)" stroke-width="1.5" stroke-dasharray="2 2.2"/></svg>';
  const fill = st === 'strong' ? '<circle cx="7" cy="7" r="3.2" fill="' + c + '"/>' : '<path d="M7 3.8a3.2 3.2 0 0 1 0 6.4z" fill="' + c + '"/>';
  return `<svg class="ring" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="${c}" stroke-width="1.5"/>${fill}</svg>`;
}
function startTraining() {
  if (ALL_LINES.some(l => lineStatus(l.id) === 'due')) return startReview();
  const op = OPENINGS.find(o => o.main.some(l => !S.lines[l.id]));
  if (!op) return startReview();
  const items = op.main.filter(l => !S.lines[l.id]).slice(0, 3).map(l => ({ lineId: l.id, mode: 'learn' }));
  Trainer.start({ title: op.name, back: { name: 'home' }, items });
}

function startDrill(op) {
  const now = Date.now();
  const learned = op.lines.filter(l => S.lines[l.id]);
  if (!learned.length) { toast('Learn a line first.'); return; }
  const due = learned.filter(l => S.lines[l.id].due <= now).sort((a, b) => S.lines[a.id].due - S.lines[b.id].due);
  let pick = due.slice(0, 8);
  if (pick.length < 5) {
    const rest = learned.filter(l => !pick.includes(l)).sort((a, b) => S.lines[a.id].stage - S.lines[b.id].stage || S.lines[a.id].due - S.lines[b.id].due);
    pick = pick.concat(rest.slice(0, 5 - pick.length));
  }
  Trainer.start({ title: op.name, back: { name: 'opening', id: op.id }, items: shuffle(pick).map(l => ({ lineId: l.id, mode: 'drill' })) });
}
function startReview() {
  const now = Date.now();
  const byOp = OPENINGS.map(o => o.lines.filter(l => lineStatus(l.id, now) === 'due').sort((a, b) => S.lines[a.id].due - S.lines[b.id].due));
  const items = [];
  // Interleave openings so consecutive lines differ.
  while (items.length < 15 && byOp.some(a => a.length)) for (const a of byOp) if (a.length && items.length < 15) items.push({ lineId: a.shift().id, mode: 'drill' });
  if (!items.length) { toast('Nothing is due right now.'); return; }
  Trainer.start({ title: 'Daily review', back: { name: 'home' }, items });
}
function startWeak() {
  const items = weakList().slice(0, 10).map(w => ({ lineId: w.lineId, ply: w.ply, mode: 'spot' }));
  if (!items.length) { toast('No weak spots. Clean play!'); return; }
  Trainer.start({ title: 'Weak spots', back: { name: 'home' }, items: shuffle(items) });
}

function setEvalBar(fen, orient) {
  const bar = $('#evalbar');
  if (!bar) return;
  bar.classList.toggle('off', !S.settings.evalbar);
  bar.classList.toggle('flip', orient === 'b');
  if (!S.settings.evalbar) return;
  if (Engine.failed) { bar.title = 'The engine could not start here'; return; }
  const ln = Engine.lines[0];
  if (!ln || Engine.cur !== fen) return; // keep the last value until the new one arrives
  const e = evalFor(ln, fen, 'w');
  const v = e.mate != null ? (e.mate > 0 ? 10 : -10) : Math.max(-10, Math.min(10, e.v));
  const white = 50 + 50 * (2 / (1 + Math.exp(-0.45 * v)) - 1);
  bar.firstElementChild.style.height = white + '%';
  const lab = bar.querySelector('b');
  const whiteBetter = e.mate != null ? e.mate > 0 : e.v >= 0;
  lab.textContent = e.mate != null ? 'M' + Math.abs(e.mate) : Math.abs(e.v).toFixed(1);
  lab.className = whiteBetter ? 'w' : 'b';
  bar.title = `Evaluation: ${fmtEval(e)} from White's side`;
}

// Options list: book moves + engine candidates for the side to move.
function optionsHTML({ fen, op, color, showBook = true }) {
  const node = op.pos.get(posKey(fen));
  const book = showBook && node ? [...node.values()] : [];
  const stm = fen.split(' ')[1];
  const isUser = stm === op.side;
  // Mid-search, lines can briefly come from different depths and repeat a first move; keep the first.
  const eng = S.settings.engine && !Engine.failed && Engine.cur === fen ? Engine.lines.filter((l, i, arr) => l && arr.findIndex(x => x && x.pv[0] === l.pv[0]) === i) : [];
  const evalOf = uci => { const l = eng.find(x => x.pv[0] === uci); return l ? evalFor(l, fen, color) : null; };
  const evClass = e => (e.v > 0.3 ? 'pos' : e.v < -0.3 ? 'neg' : '');
  const trapOnly = b => b.lines.every(id => LINES[id].trap);
  let html = '';
  for (const b of book) {
    const e = evalOf(b.uci);
    html += `<button class="opt ${isUser ? 'rep' : ''}" data-uci="${b.uci}" data-kind="${isUser ? 'green' : 'ghost'}">
      <span class="san2">${esc(b.san)}</span><span class="kind${trapOnly(b) ? ' trap' : ''}">${trapOnly(b) ? 'Trap' : 'Book'}</span>
      ${e ? `<span class="ev ${evClass(e)}" title="Engine score from your side">${fmtEval(e)}</span>` : '<span></span>'}
      ${b.c ? `<span class="why">${esc(b.c)}</span>` : ''}</button>`;
  }
  eng.forEach((l, i) => {
    if (book.some(b => b.uci === l.pv[0])) return;
    const sans = pvSan(fen, l.pv, 5);
    if (!sans.length) return;
    const e = evalFor(l, fen, color);
    html += `<button class="opt" data-uci="${l.pv[0]}" data-kind="blue">
      <span class="san2">${esc(sans[0])}</span><span class="kind">Engine</span><span class="ev ${evClass(e)}" title="Engine score from your side">${fmtEval(e)}</span>
      <span class="pvline">${esc(sans.join(' '))}</span></button>`;
  });
  let note = '';
  if (S.settings.engine) {
    if (Engine.failed) note = 'Engine unavailable.';
    else if (Engine.cur !== fen || (Engine.busy && !Engine.lines.length)) note = '<span class="spinner"></span>';

  }

  return { html, note };
}

// ---------- trainer (learn / drill / weak spots) ----------
const Trainer = {
  active: false,
  start(session) {
    Explorer.stop();
    this.active = true;
    this.session = session;
    this.idx = 0;
    this.combo = 0;
    this.sessionXP = 0;
    this.results = [];
    this.timer = 0;
    trainerShell();
    $('#backLabel').textContent = session.back.name === 'home' ? 'Home' : OP[session.back.id].name;
    $('#backBtn').onclick = () => go(session.back);
    this.board = new Board($('#board'), {
      canPick: sq => this.canPick(sq),
      ranks: $('#ranks'), files: $('#files'),
      onMove: (f, t, d) => this.userMove(f, t, d),
    });
    this.engineListener = () => this.onEngine();
    Engine.listeners.add(this.engineListener);
    this.keyHandler = e => {
      if (e.target.closest?.('input,textarea')) return;
      const live = this.game.history().length, cur = this.view == null ? live : this.view;
      if (e.key === 'ArrowLeft') { e.preventDefault(); this.viewTo(cur - 1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); this.viewTo(cur + 1); }
      if (e.key === 'Home') { e.preventDefault(); this.viewTo(0); }
      if (e.key === 'End') { e.preventDefault(); this.viewTo(null); }
      if (e.key === 'h') this.hint();
      if (e.key === 'n' && this.doneState && this.doneState.st) this.next();
    };
    addEventListener('keydown', this.keyHandler);
    renderStats();
    this.loadItem();
  },
  stop() {
    if (!this.active) return;
    this.active = false;
    clearTimeout(this.timer);
    Engine.listeners.delete(this.engineListener);
    Engine.stop();
    removeEventListener('keydown', this.keyHandler);
  },
  get item() { return this.session.items[this.idx]; },
  loadItem() {
    clearTimeout(this.timer);
    const it = this.item;
    this.line = LINES[it.lineId];
    this.op = this.line.op;
    this.user = this.op.side;
    this.mode = it.mode;
    this.phase = it.mode === 'learn' ? 'study' : 'recall';
    this.attempt = 1;
    this.board.setOrientation(this.user);
    this.resetLine();
  },
  resetLine() {
    clearTimeout(this.timer);
    this.game = new Chess();
    this.ply = 0;
    this.res = [];
    this.mistakes = 0;
    this.hintsUsed = 0;
    this.doneState = null;
    this.coach = { tone: '', title: '', text: '', mine: null, opp: null };
    this.lastMine = null;
    this.revealed = false;
    this.locked = true;
    this.view = null;
    if (this.mode === 'spot') {
      const target = this.item.ply;
      let lastMove = null;
      for (let i = 0; i < target; i++) { lastMove = this.game.move(uciObj(this.line.moves[i][1])); this.res[i] = 'pre'; }
      this.ply = target;
      this.board.setPosition(this.game, { instant: true });
      if (lastMove) this.board.mark({ last: [lastMove.from, lastMove.to] });
      const prev = this.line.moves[target - 1];
      if (prev) this.coach.opp = { ply: target - 1, san: prev[0], c: prev[2] };
    } else {
      this.board.setPosition(this.game, { instant: true });
    }
    this.board.setArrows([]);
    this.board.mark({ hint: null });
    this.renderPanel();
    setEvalBar(this.game.fen(), this.board.orient);
    this.requestEngine();
    this.timer = setTimeout(() => this.advance(), this.mode === 'spot' ? 50 : 500);
  },
  canPick(sq) {
    if (this.locked || this.doneState || this.view != null) return false;
    const p = this.game.get(sq);
    return !!p && p.color === this.user && this.game.turn() === this.user;
  },
  expected() { return this.line.moves[this.ply]; },
  advance() {
    if (!this.active) return;
    this.board.setArrows([]);
    this.board.mark({ hint: null });
    if (this.ply >= this.line.moves.length || (this.mode === 'spot' && this.ply > this.item.ply)) return this.lineDone();
    const [san, uci, c] = this.expected();
    if (this.game.turn() !== this.user) {
      this.locked = true;
      this.timer = setTimeout(() => {
        if (this.view != null) this.viewTo(null);
        const mv = this.game.move(uciObj(uci));
        this.board.setPosition(this.game, { move: mv });
        Sound.play(mv.captured ? 'capture' : 'move');
        this.coach.opp = { ply: this.ply, san, c };
        this.res[this.ply] = 'opp';
        this.ply++;
        this.advance();
        if (this.locked) this.requestEngine();
      }, this.ply === 0 ? 150 : 650);
      return;
    }
    this.locked = false;
    this.hintLevel = 0;
    this.wrongs = 0;
    if (this.phase === 'study') {
      this.coach.tone = '';
      this.coach.title = 'Play';
      this.coach.san = sanAt(this.ply, san);
      this.coach.text = c || 'This is the book move.';
      this.board.setArrows([{ from: uci.slice(0, 2), to: uci.slice(2, 4), color: 'green' }]);
    } else {
      this.coach.tone = '';
      this.coach.title = 'Your move';
      this.coach.san = null;
      this.coach.text = '';
      this.coach.mine = this.lastMine;
    }
    this.renderPanel();
    this.requestEngine();
  },
  userMove(from, to, dragged) {
    if (this.locked || this.doneState) return;
    if (this.view != null) this.viewTo(null);
    const exp = this.expected();
    const uci = exp[1];
    if (from === uci.slice(0, 2) && to === uci.slice(2, 4)) {
      const mv = this.game.move(uciObj(uci));
      this.board.setPosition(this.game, { move: mv, dragged });
      this.board.flash(to, 'good');
      Sound.play(mv.captured ? 'capture' : 'move');
      let r = 'ok';
      if (this.phase !== 'study') r = this.wrongs ? 'miss' : this.hintLevel ? 'hint' : 'ok';
      this.res[this.ply] = r;
      if (this.phase === 'study') addXP(1);
      else if (r === 'ok') {
        this.combo++;
        const gain = 5 + (this.combo >= 8 ? 5 : this.combo >= 3 ? 2 : 0);
        this.sessionXP += gain;
        addXP(gain, to);
        if (this.combo >= 3) Sound.play('good');
      } else this.combo = 0;
      this.coach = { tone: r === 'ok' ? 'good' : 'gold', title: r === 'ok' ? 'Correct' : 'Got there', san: sanAt(this.ply, exp[0]), text: exp[2], opp: null, mine: null };
      this.lastMine = this.phase === 'study' ? null : { ply: this.ply, san: exp[0], c: exp[2], r };
      this.ply++;
      this.locked = true;
      this.renderPanel();
      this.timer = setTimeout(() => this.advance(), this.phase === 'study' ? 500 : 350);
      return;
    }
    // Wrong move: snap back and explain.
    this.board.setPosition(this.game, { instant: false });
    if (this.lastMoveOf()) this.board.mark({ last: this.lastMoveOf() });
    this.board.shake();
    this.board.flash(to, 'wrong');
    Sound.play('bad');
    this.combo = 0;
    if (this.phase === 'study') {
      this.coach = { ...this.coach, tone: 'bad', title: 'Follow the arrow', text: exp[2] || '' };
      this.renderPanel();
      return;
    }
    if (!this.wrongs) { recordWeak(this.line.id, this.ply); save(); }
    this.wrongs++;
    this.mistakes++;
    const tried = this.game.moves({ verbose: true }).find(m => m.from === from && m.to === to);
    const p = this.game.get(uci.slice(0, 2));
    if (this.wrongs === 1) {
      this.hintLevel = Math.max(this.hintLevel, 1);
      this.board.mark({ hint: uci.slice(0, 2) });
      this.coach = { ...this.coach, tone: 'bad', title: `Not ${tried ? tried.san : 'that'}`, san: null, text: `Try again. It's a ${PIECE_NAME[p.type]} move.` };
    } else {
      this.hintLevel = 2;
      this.board.mark({ hint: null });
      this.board.setArrows([{ from: uci.slice(0, 2), to: uci.slice(2, 4), color: 'gold' }]);
      this.coach = { ...this.coach, tone: 'bad', title: 'Play', san: sanAt(this.ply, exp[0]), text: exp[2] || '' };
      this.revealed = true;
    }
    this.renderPanel();
    this.requestEngine();
  },
  /** Look at an earlier position (n moves played) without changing the game. null returns to the live position. */
  viewTo(n) {
    const live = this.game.history().length;
    if (n != null) n = Math.max(0, Math.min(live, n));
    if (n === live) n = null;
    if (n === this.view) return;
    this.view = n;
    if (n == null) {
      this.board.setPosition(this.game, {});
      const last = this.lastMoveOf();
      this.board.mark({ last, hint: this.hintLevel === 1 && !this.locked ? this.expected()[1].slice(0, 2) : null });
      this.board.setArrows(this.baseArrows());
    } else {
      const g = new Chess();
      let m = null;
      for (let i = 0; i < n; i++) m = g.move(uciObj(this.line.moves[i][1]));
      this.board.setPosition(g, {});
      this.board.mark({ last: m ? [m.from, m.to] : null, hint: null });
      this.board.setArrows([]);
    }
    this.renderNav();
  },
  renderNav() {
    const live = this.game.history().length;
    const cur = this.view == null ? live : this.view;
    const set = (id, on) => { const b = $('#' + id); if (b) b.disabled = !on; };
    set('navStart', cur > 0); set('navBack', cur > 0); set('navFwd', cur < live); set('navEnd', cur < live);
    $('#board').classList.toggle('viewing', this.view != null);
  },
  lastMoveOf() {
    const h = this.game.history({ verbose: true });
    const m = h[h.length - 1];
    return m ? [m.from, m.to] : null;
  },
  hint() {
    if (this.locked || this.doneState || this.game.turn() !== this.user || this.phase === 'study') return;
    const uci = this.expected()[1];
    this.hintsUsed++;
    if (this.hintLevel === 0) {
      this.hintLevel = 1;
      this.board.mark({ hint: uci.slice(0, 2) });
      this.coach = { ...this.coach, tone: 'gold', title: 'Hint', san: null, text: '' };
    } else {
      this.hintLevel = 2;
      this.board.mark({ hint: null });
      this.board.setArrows([{ from: uci.slice(0, 2), to: uci.slice(2, 4), color: 'gold' }]);
      this.coach = { ...this.coach, tone: 'gold', title: 'Play', san: sanAt(this.ply, this.expected()[0]), text: this.expected()[2] || '' };
      this.revealed = true;
    }
    this.combo = 0;
    this.renderPanel();
    this.requestEngine();
  },
  lineDone() {
    this.locked = true;
    this.requestEngine();
    const userRes = this.line.userPlies.filter(i => this.res[i] && this.res[i] !== 'pre').map(i => this.res[i]);
    const perfect = userRes.every(r => r === 'ok');
    const okCount = userRes.filter(r => r === 'ok').length;
    if (this.mode === 'spot') {
      const k = this.line.id + '|' + this.item.ply;
      if (perfect && S.weak[k]) { S.weak[k].c--; if (S.weak[k].c <= 0) delete S.weak[k]; addXP(8); }
      save();
      this.results.push({ perfect });
      this.doneState = { perfect };
      this.coach.title = perfect ? 'Fixed' : 'Keep at it';
      this.coach.tone = perfect ? 'good' : 'gold';
      this.renderPanel();
      if (perfect) Sound.play('good');
      this.timer = setTimeout(() => this.next(), perfect ? 1400 : 2200);
      return;
    }
    if (this.mode === 'learn' && this.phase === 'study') {
      this.doneState = { study: true };
      Sound.play('good');
      this.renderPanel();
      return;
    }
    let st = null;
    if (this.mode === 'learn') {
      if (!perfect && this.attempt < 3) {
        this.doneState = { retry: true, perfect, okCount, total: userRes.length };
      } else {
        st = grade(this.line.id, perfect, 'learn');
        this.doneState = { perfect, okCount, total: userRes.length, st };
      }
    } else {
      st = grade(this.line.id, perfect, 'drill');
      this.doneState = { perfect, okCount, total: userRes.length, st };
      if (!perfect && !this.item.retried) this.session.items.push({ ...this.item, retried: true });
    }
    if (st) {
      const bonus = perfect ? 20 : 5;
      this.sessionXP += bonus;
      addXP(bonus);
      this.results.push({ perfect, lineId: this.line.id });
    }
    if (perfect) { Sound.play('done'); confetti(); } else Sound.play('good');
    renderStats();
    this.renderPanel();
  },
  next() {
    clearTimeout(this.timer);
    this.idx++;
    if (this.idx >= this.session.items.length) return this.sessionDone();
    this.loadItem();
  },
  sessionDone() {
    this.doneState = { session: true };
    this.locked = true;
    this.board.setArrows([]);
    this.renderPanel();
  },
  requestEngine() {
    if (S.settings.evalbar || (this.optionsVisible() && S.settings.engine)) Engine.analyze(this.game.fen());
  },
  optionsVisible() {
    if (this.doneState || this.game.turn() !== this.user) return false;
    return this.phase === 'study' || this.revealed;
  },
  onEngine() {
    if (!this.active) return;
    const fen = this.game.fen();
    setEvalBar(fen, this.board.orient);
    if (this.optionsVisible()) this.renderOptions();
  },
  renderOptions() {
    const box = $('#optsBox');
    if (!box) return;
    if (!this.optionsVisible()) {
      const atUser = !this.doneState && this.game.turn() === this.user && !this.locked;
      box.innerHTML = atUser ? `<div class="veil"><button class="btn small" id="revealBtn" title="Counts as a hint">Show best moves</button></div>` : '';
      $('#revealBtn') && ($('#revealBtn').onclick = () => { this.hintLevel = 2; this.hintsUsed++; this.revealed = true; this.combo = 0; this.renderPanel(); this.requestEngine(); });
    } else {
      const fen = this.game.fen();
      const { html, note } = optionsHTML({ fen, op: this.op, color: this.user });
      box.innerHTML = `<div class="sect-head"><span class="kicker">Best moves</span>${engineSwitchHTML()}</div>
        <div class="opts">${html}</div>${note ? `<div class="engine-note">${note}</div>` : ''}`;
      $$('.opt', box).forEach(b => {
        const u = b.dataset.uci;
        b.onmouseenter = () => this.board.setArrows([...(this.baseArrows() || []), { from: u.slice(0, 2), to: u.slice(2, 4), color: b.dataset.kind === 'green' ? 'green' : 'blue', w: 0.12 }]);
        b.onmouseleave = () => this.board.setArrows(this.baseArrows());
        b.onclick = () => { if (b.dataset.kind === 'green') this.userMove(u.slice(0, 2), u.slice(2, 4), false); };
      });
    }
    this.bindEngineToggle();
  },
  baseArrows() {
    if (this.locked || this.doneState) return [];
    const uci = this.expected()?.[1];
    if (!uci) return [];
    if (this.phase === 'study') return [{ from: uci.slice(0, 2), to: uci.slice(2, 4), color: 'green' }];
    if (this.hintLevel >= 2) return [{ from: uci.slice(0, 2), to: uci.slice(2, 4), color: 'gold' }];
    return [];
  },
  bindEngineToggle() {
    const t = $('#engineToggle');
    if (t) t.onchange = () => {
      S.settings.engine = t.checked; save();
      if (!t.checked && !S.settings.evalbar) Engine.stop();
      this.renderOptions(); this.requestEngine();
    };
  },
  renderPanel() {
    const L = this.line, op = this.op;
    const modeLabel = { learn: this.phase === 'study' ? 'Learn · follow the arrows' : 'Learn · now from memory', drill: 'Drill · from memory', spot: 'Weak spot · you missed this before' }[this.mode];
    const modeCls = { learn: 'learn', drill: 'drill', spot: 'weak' }[this.mode];
    const prog = L.moves.map((_, i) => {
      const r = this.res[i];
      const user = L.userPlies.includes(i);
      let cls = '';
      if (r === 'opp' || r === 'pre') cls = 'u';
      else if (r === 'ok') cls = 'done'; else if (r === 'hint') cls = 'hinted'; else if (r === 'miss') cls = 'miss';
      if (i === this.ply && !this.doneState && user) cls += ' now';
      return `<i class="${cls}" title="${esc(sanAt(i, L.moves[i][0]))}"></i>`;
    }).join('');
    const sess = this.session;
    const counter = `${Math.min(this.idx + 1, sess.items.length)} / ${sess.items.length}`;
    const panel = $('#panel');
    panel.innerHTML = `
      <header class="p-head">
        <span class="mode mode-${modeCls}">${modeLabel}</span>
        <h2>${L.trap ? '<span class="trap-tag">Trap</span> ' : ''}${esc(L.name)}${sess.items.length > 1 ? ` <span class="count mono">${counter}</span>` : ''}${this.combo >= 2 ? `<span class="combo pop" title="Correct moves in a row">${this.combo}×</span>` : ''}</h2>
        <div class="progress" title="${modeLabel}">${prog}</div>
      </header>
      <section id="coachBox"></section>
      <section class="sect" id="optsBox"></section>
      <section class="sect"><div class="sheet" id="sheet"></div></section>`;
    this.renderCoach();
    this.renderOptions();
    this.renderSheet();
    $('#boardCtrl').innerHTML = `
      ${navButtonsHTML(false, false)}
      <button class="btn small" id="hintBtn" ${this.phase === 'study' || this.doneState ? 'disabled' : ''} title="Shortcut: H">Hint</button>
      <button class="btn small" id="restartBtn">Restart</button>
      <button class="btn small" id="flipBtn">Flip</button>
      ${evalButtonHTML()}
      <button class="btn small" id="freeBtn" title="Open this position and move both sides">Free play</button>`;
    $('#navStart').onclick = () => this.viewTo(0);
    $('#navBack').onclick = () => { const live = this.game.history().length; this.viewTo((this.view == null ? live : this.view) - 1); };
    $('#navFwd').onclick = () => { const live = this.game.history().length; this.viewTo((this.view == null ? live : this.view) + 1); };
    $('#navEnd').onclick = () => this.viewTo(null);
    this.renderNav();
    bindEvalButton(() => this.game.fen(), () => this.board.orient);
    $('#freeBtn').onclick = () => Explorer.start(this.op, {
      moves: this.game.history({ verbose: true }).map(m => m.from + m.to + (m.promotion || '')),
      free: true, back: this.session.back,
    });
    $('#hintBtn').onclick = () => this.hint();
    $('#restartBtn').onclick = () => { this.combo = 0; this.resetLine(); };
    $('#flipBtn').onclick = () => { this.board.setOrientation(this.board.orient === 'w' ? 'b' : 'w'); setEvalBar(this.game.fen(), this.board.orient); };
  },
  renderCoach() {
    const box = $('#coachBox');
    const c = this.coach, d = this.doneState;
    const tally = items => `<dl class="tally">${items.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
    if (d && d.session) {
      const n = this.results.length, p = this.results.filter(r => r.perfect).length;
      box.innerHTML = `<div class="coach good">
        <h3 class="coach-title">Session complete</h3>
        ${tally([['Lines', n], ['Perfect', p]])}
        <div class="actions"><button class="btn primary" id="doneBack">Done</button></div></div>`;
      $('#doneBack').onclick = () => go(this.session.back);
      return;
    }
    if (d && d.study) {
      box.innerHTML = `<div class="coach gold">
        <h3 class="coach-title">Now from memory</h3>
        <p class="coach-text">Same line, no arrows.</p>
        <div class="actions"><button class="btn primary" id="recallBtn">Start</button><button class="btn" id="againBtn">Watch again</button></div></div>`;
      $('#recallBtn').onclick = () => { this.phase = 'recall'; this.resetLine(); };
      $('#againBtn').onclick = () => this.resetLine();
      return;
    }
    if (d && d.retry) {
      box.innerHTML = `<div class="coach gold">
        <h3 class="coach-title">${d.okCount} of ${d.total} from memory</h3>
        <p class="coach-text">Play it once without a mistake to lock it in.</p>
        <div class="actions"><button class="btn primary" id="retryBtn">Try again</button></div></div>`;
      $('#retryBtn').onclick = () => { this.attempt++; this.resetLine(); };
      return;
    }
    if (d && d.st) {
      const last = this.idx + 1 >= this.session.items.length;
      box.innerHTML = `<div class="coach ${d.perfect ? 'good' : 'gold'}">
        <h3 class="coach-title">${d.perfect ? 'Perfect line' : 'Line complete'}</h3>
        ${tally([['Correct', `${d.okCount}/${d.total}`], ['Mistakes', this.mistakes], ['Review', nextReviewText(d.st)]])}
        <div class="actions"><button class="btn primary" id="nextBtn">${last ? 'Finish' : 'Next line'}</button><button class="btn" id="repeatBtn">Repeat</button></div></div>`;
      $('#nextBtn').onclick = () => this.next();
      $('#repeatBtn').onclick = () => { this.phase = 'recall'; this.resetLine(); };
      $('#nextBtn').focus({ preventScroll: true });
      return;
    }
    const mineLabel = { ok: '', hint: '', miss: '' };
    box.innerHTML = `<div class="coach ${c.tone}">
      <h3 class="coach-title">${esc(c.title || '')}${c.san ? `<span class="san">${esc(c.san)}</span>` : ''}</h3>
      ${c.text ? `<p class="coach-text">${esc(c.text)}</p>` : ''}
      ${c.mine ? `<p class="note"><b>${esc(sanAt(c.mine.ply, c.mine.san))}</b>${c.mine.c ? ` ${esc(c.mine.c)}` : ''}</p>` : ''}
      ${c.opp ? `<p class="note"><b>${esc(sanAt(c.opp.ply, c.opp.san))}</b>${c.opp.c ? ` ${esc(c.opp.c)}` : ''}</p>` : ''}
    </div>`;
  },
  renderSheet() {
    const L = this.line;
    let html = '';
    const lastPly = this.doneState ? L.moves.length - 1 : this.ply;
    for (let i = 0; i < L.moves.length; i += 2) {
      if (i > lastPly) break;
      html += `<div class="n">${i / 2 + 1}</div>`;
      for (const j of [i, i + 1]) {
        const m = L.moves[j];
        if (!m) { html += '<div></div>'; continue; }
        const r = this.res[j];
        const shown = j < this.ply || this.doneState;
        const cls = !shown ? 'ghost' : r === 'ok' ? 'ok' : r === 'hint' ? 'hint' : r === 'miss' ? 'miss' : '';
        html += `<div class="m ${cls}">${shown ? esc(m[0]) : (j === this.ply ? '?' : '')}</div>`;
      }
    }
    const sh = $('#sheet');
    sh.innerHTML = html;
    sh.scrollTop = sh.scrollHeight;
  },
};

// ---------- explorer ----------
const Explorer = {
  active: false,
  /** opts: { moves: [uci], free: move both sides, back: view to return to, load: open the paste box } */
  start(op, opts = {}) {
    Trainer.stop();
    this.active = true;
    this.op = op;
    this.user = op.side;
    this.auto = !opts.free;
    this.showLoad = !!opts.load;
    this.startFen = null;
    this.ply0 = 0;
    this.moves = (opts.moves || []).slice(); // the whole move list, as uci
    this.cursor = this.moves.length;          // how many of them are on the board
    this.game = this.build(this.cursor);
    const back = opts.back || { name: 'opening', id: op.id };
    trainerShell();
    $('#backLabel').textContent = back.name === 'home' ? 'Home' : OP[back.id].name;
    $('#backBtn').onclick = () => go(back);
    this.board = new Board($('#board'), {
      ranks: $('#ranks'), files: $('#files'),
      canPick: sq => {
        const p = this.game.get(sq);
        if (!p || p.color !== this.game.turn() || this.thinking) return false;
        return !this.auto || p.color === this.user;
      },
      onMove: (f, t, d) => this.play(f, t, d),
    });
    this.board.setOrientation(this.user);
    this.board.setPosition(this.game, { instant: true });
    this.markLast();
    this.engineListener = () => { if (this.active) { setEvalBar(this.game.fen(), this.board.orient); this.renderOptions(); } };
    Engine.listeners.add(this.engineListener);
    this.keyHandler = e => {
      if (e.target.closest?.('input,textarea')) return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); this.stepTo(this.cursor - 1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); this.stepTo(this.cursor + 1); }
      else if (e.key === 'Home') { e.preventDefault(); this.stepTo(0); }
      else if (e.key === 'End') { e.preventDefault(); this.stepTo(this.moves.length); }
    };
    addEventListener('keydown', this.keyHandler);
    this.render();
    if (this.auto && this.game.turn() !== this.user) this.autoReply();
  },
  stop() {
    if (!this.active) return;
    this.active = false;
    clearTimeout(this.timer);
    Engine.listeners.delete(this.engineListener);
    removeEventListener('keydown', this.keyHandler);
    Engine.stop();
  },
  /** A game with the first n moves played; also sets this.last for the coach. */
  build(n) {
    const g = this.startFen ? new Chess(this.startFen) : new Chess();
    this.last = null;
    for (let i = 0; i < n; i++) {
      const before = this.op.pos.get(posKey(g.fen()));
      const m = g.move(uciObj(this.moves[i]));
      if (i === n - 1) this.last = { san: m.san, ply: this.ply0 + i, entry: before && before.get(this.moves[i]), color: m.color, from: m.from, to: m.to };
    }
    return g;
  },
  markLast() { this.board.mark({ last: this.last ? [this.last.from, this.last.to] : null }); },

    let startFen = null, ply0 = 0;
    const g = new Chess();
    if (/^([pnbrqkPNBRQK1-8]+\/){7}[pnbrqkPNBRQK1-8]+\s+[wb]/.test(t)) {
      if (!g.load(t)) { msg.textContent = 'That FEN is not a valid position.'; return; }
      const f = t.split(/\s+/);
      startFen = g.fen();
      ply0 = (Math.max(1, parseInt(f[5] || '1', 10)) - 1) * 2 + (f[1] === 'b' ? 1 : 0);
    } else {
      const body = t.replace(/\[[^\]]*\]/g, ' ').replace(/\{[^}]*\}/g, ' ').replace(/\([^)]*\)/g, ' ').replace(/\$\d+/g, ' ');

        const tok = toks[i].replace(/^0-0-0/, 'O-O-O').replace(/^0-0/, 'O-O');
        if (!g.move(tok, { sloppy: true })) { msg.textContent = `${Math.floor(i / 2) + 1}${i % 2 ? '…' : '.'}${toks[i]} is not legal. Loaded the moves before it.`; break; }
      }
      if (!g.history().length) return;
    }
    clearTimeout(this.timer);
    this.thinking = false;
    this.startFen = startFen;
    this.ply0 = ply0;
    this.moves = g.history({ verbose: true }).map(m => m.from + m.to + (m.promotion || ''));
    if (!startFen) {
      const r = new Chess(), keys = [posKey(r.fen())];
      for (const u of this.moves) { r.move(uciObj(u)); keys.push(posKey(r.fen())); }
      let best = this.op, bestN = -1;
      for (const o of OPENINGS) { let n = 0; for (const k of keys) if (o.pos.has(k)) n++; if (n > bestN) { best = o; bestN = n; } }
      this.op = best; this.user = best.side;
    }
    this.cursor = this.moves.length;
    this.game = this.build(this.cursor);
    this.auto = false;
    this.showLoad = false;
    const keep = msg.textContent;
    this.board.setPosition(this.game, { instant: true });
    this.markLast();
    this.render();
    if (keep) toast(keep);
  },
  renderOptions() {
    const box = $('#optsBox');
    if (!box) return;
    const fen = this.game.fen();
    const { html, note } = optionsHTML({ fen, op: this.op, color: this.user });
    box.innerHTML = `<div class="sect-head"><span class="kicker">${this.game.game_over() ? 'Game over' : 'Best moves'}</span>${engineSwitchHTML()}</div><div class="opts">${html}</div>${note ? `<div class="engine-note">${note}</div>` : ''}`;
    $$('.opt', box).forEach(b => {
      const u = b.dataset.uci;
      b.onmouseenter = () => this.board.setArrows([{ from: u.slice(0, 2), to: u.slice(2, 4), color: b.dataset.kind === 'green' ? 'green' : 'blue' }]);
      b.onmouseleave = () => this.board.setArrows([]);
      b.onclick = () => {

    });
    const t = $('#engineToggle');
    if (t) t.onchange = () => {
      S.settings.engine = t.checked; save();
      if (!t.checked && !S.settings.evalbar) Engine.stop(); else Engine.analyze(this.game.fen());
      this.renderOptions();
    };
  },
};

// Staunton pawn profile [radius, height], height 1: base Ø 0.6, collar Ø 0.36, head Ø 0.29.
function pawnProfile() {

  arc(0.255, 0.082, 0.018, -D, -0.2, 3); arc(0.246, 0.098, 0.022, -D * 0.6, D, 6);
  P.push([0.2, 0.13]);

  P.push([0.12, 0.5]); arc(0.14, 0.52, 0.026, -D, D, 8); P.push([0.072, 0.556]);

  b: { rings: 34, meridians: 36, line: [0xffffff, 0.34], meridian: [0x8B93F0, 0.3], points: 0, scan: true, cam: [0, 0.2, 3.3], look: [0, 0, 0], scale: 1.25 },
  c: { rings: 46, meridians: 44, line: [0xffffff, 0.07], meridian: [0xffffff, 0.05], points: [0xffffff, 0.9], cam: [0, 0.14, 2.9], look: [0, 0.1, 0], scale: 1.32 },

function evalBarTo(cpWhite, mateWhite, orient) {

  bar.classList.remove('off'); bar.classList.toggle('flip', orient === 'b');
  const v = mateWhite != null ? (mateWhite > 0 ? 10 : -10) : Math.max(-10, Math.min(10, cpWhite / 100));

/** Parse pasted moves, a PGN or a FEN-tagged PGN. */
function parseGame(text) {
  const t = (text || '').trim();
  if (!t) return { error: 'Paste a PGN or a list of moves first.' };
  const tags = {};
  t.replace(/\[(\w+)\s+"([^"]*)"\]/g, (_, k, v) => { tags[k] = v; });
  const g = tags.FEN ? new Chess(tags.FEN) : new Chess();
  if (tags.FEN && g.fen() !== new Chess(tags.FEN).fen()) return { error: 'The FEN in that PGN is not valid.' };
  const startFen = g.fen();
  const body = t.replace(/\[[^\]]*\]/g, ' ').replace(/\{[^}]*\}/g, ' ').replace(/;[^\n]*/g, ' ');
  let depth = 0, clean = '';
  for (const ch of body) { if (ch === '(') depth++; else if (ch === ')') depth--; else if (!depth) clean += ch; }
  const toks = clean.replace(/\$\d+/g, ' ').split(/\s+/).map(x => x.replace(/^\d+\.(\.\.)?/, '').replace(/[!?]+$/, '')).filter(x => x && !/^(1-0|0-1|1\/2-1\/2|\*|\.\.\.|…|\d+\.+)$/.test(x));
  let warn = '';
  for (let i = 0; i < toks.length; i++) {
    const tok = toks[i].replace(/^0-0-0/, 'O-O-O').replace(/^0-0/, 'O-O');
    if (!g.move(tok, { sloppy: true })) { warn = `Stopped at “${toks[i]}”, which is not a legal move there.`; break; }
  }
  const moves = g.history({ verbose: true });
  if (!moves.length) return { error: warn || 'No moves found in that text.' };
  return { startFen, moves, tags, warn };
}

  begin(text, meta = null) {

  drawGraph() {
    const n = this.marks.length, W = 400, H = 96;

    // Catmull-Rom through the points, as cubic Béziers, so the peaks are rounded
    let d = `M0 ${H} L${pts[0][0]} ${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];

      ? `<i class="c-${m.cls}" style="left:${((i + 1) / n * 100).toFixed(2)}%;top:${(y(m.cpWhiteAfter) / H * 100).toFixed(2)}%" title="${esc(sanAt(i, m.san))}: ${CLS[m.cls].name}"></i>` : '').join('');
  },
  renderMoves() {

      if (i === 0 && m.color === 'b') html += '<div></div>';

  to(n, instant) {

    n = Math.max(0, Math.min(this.marks.length, n));
    const forward = n === this.cur + 1 && !instant;
    const g = new Chess(this.game.startFen);
    let last = null;
    for (let i = 0; i < n; i++) last = g.move(this.game.moves[i]);
    this.cur = n;
    this.board.setPosition(g, forward && last ? { move: last } : { instant: true });
    if (forward && last) Sound.play(last.captured ? 'capture' : 'move');

    } else {

      this.board.setBadge(last.to, 'c-' + m.cls, CLS[m.cls].glyph);
      const arrows = [];
      const bestU = m.best && m.best[0];
      const good = ['brilliant', 'great', 'best', 'excellent', 'good', 'book', 'forced'].includes(m.cls);
      if (bestU && bestU !== m.uci && !good) arrows.push({ from: bestU.slice(0, 2), to: bestU.slice(2, 4), color: 'rgba(129,182,76,.85)' });

      const bestSan = bestU && bestU !== m.uci ? pvSan(m.fenBefore, m.best, 4) : [];
      const verdict = { brilliant: 'is brilliant', great: 'is a great move', best: 'is the best move', excellent: 'is excellent', good: 'is good', book: 'is a book move', inaccuracy: 'is an inaccuracy', mistake: 'is a mistake', miss: 'is a miss', blunder: 'is a blunder', forced: 'was the only legal move' }[m.cls];
      const ev = m.mateAfter != null && m.mateAfter !== 0 ? 'Mate in ' + Math.abs(m.mateAfter) : (m.cpWhiteAfter >= 9000 ? 'Checkmate' : (m.cpWhiteAfter > 0 ? '+' : '') + (m.cpWhiteAfter / 100).toFixed(2));

        ${bestSan.length && !good ? `<p class="muted">Best was <b style="color:var(--fg)">${esc(bestSan[0])}</b>${bestSan.length > 1 ? `, continuing ${esc(bestSan.slice(1).join(' '))}` : ''}.</p>` : ''}
        ${m.cls === 'brilliant' ? '<p class="muted">A sound piece sacrifice that the engine agrees with.</p>' : m.cls === 'great' ? '<p class="muted">The only move that keeps the advantage.</p>' : m.cls === 'miss' ? '<p class="muted">Your opponent had just slipped, and this let the chance go.</p>' : ''}`;
    }

  },
  // ----- your own moves: a side line from any point in the game -----
  canPick(sq) {
    if (this.busy) return false;
    const g = this.vari ? this.varGame(this.vari.cur) : this.mainGame(this.cur);
    const p = g.get(sq);

  },
  mainGame(n) { const g = new Chess(this.game.startFen); for (let i = 0; i < n; i++) g.move(this.game.moves[i]); return g; },
  varGame(k) { const g = this.mainGame(this.vari.base); for (let i = 0; i < k; i++) g.move(this.vari.moves[i]); return g; },
  step(d) {

  async userMove(from, to, dragged) {

    if (!mv) return;
    // the game's own next move: just step forward
    if (!this.vari && this.game.moves[this.cur] && this.game.moves[this.cur].from === mv.from && this.game.moves[this.cur].to === mv.to) { this.to(this.cur + 1); return; }
    if (!this.vari) this.vari = { base: this.cur, moves: [], marks: [], cur: 0 };
    const V = this.vari;
    V.moves = V.moves.slice(0, V.cur); V.marks = V.marks.slice(0, V.cur);
    const fenBefore = this.varGame(V.cur).fen();
    V.moves.push(mv); V.marks.push(null); V.cur = V.moves.length;
    this.board.setPosition(g, { move: mv, dragged });
    Sound.play(mv.captured ? 'capture' : 'move');
    this.busy = true;
    this.showVar(false, true);
    const mainIdx = !V.marks.slice(0, -1).length ? V.base : -1;
    const R0 = mainIdx >= 0 ? this.res[mainIdx] : await LiveEngine.eval(fenBefore);
    const R1 = await LiveEngine.eval(g.fen());
    this.busy = false;
    if (!this.active || this.vari !== V) return;
    if (!R0 || !R1) { V.marks[V.moves.length - 1] = { cls: null }; this.showVar(); toast('The engine could not start here.'); return; }
    const prev = V.moves.length > 1 ? V.marks[V.moves.length - 2]?.cls : this.marks[V.base - 1]?.cls;
    V.marks[V.moves.length - 1] = classifyMove(fenBefore, mv, R0, R1, prev, V.base + V.moves.length - 1);
    if (V.cur === V.moves.length) this.showVar();
  },
  showVar(animate, pending) {
    const V = this.vari, k = V.cur, g = this.varGame(k), mv = V.moves[k - 1], m = V.marks[k - 1];
    if (!pending) this.board.setPosition(g, animate && mv ? { move: mv } : { instant: true });
    if (animate && mv) Sound.play(mv.captured ? 'capture' : 'move');
    this.board.mark({ last: mv ? [mv.from, mv.to] : null });
    const card = $('#mvCard');
    const line = V.moves.map((x, i) => `<button data-k="${i + 1}" class="${i + 1 === k ? 'cur' : ''}">${V.marks[i] && V.marks[i].cls ? clsIcon(V.marks[i].cls) : '<span class="cls c-forced">…</span>'}<span>${esc(sanAt(V.base + i, x.san))}</span></button>`).join('');
    let head;
    if (!m) {
      this.board.setBadge(null); this.board.setArrows([]);
      head = `<div class="head"><span class="spinner"></span><b>Grading ${esc(sanAt(V.base + k - 1, mv.san))}…</b></div>`;
    } else if (!m.cls) {
      head = `<div class="head"><b>${esc(sanAt(V.base + k - 1, mv.san))}</b></div>`;
    } else {
      this.board.setBadge(mv.to, 'c-' + m.cls, CLS[m.cls].glyph);
      const bestU = m.best && m.best[0];
      const good = ['brilliant', 'great', 'best', 'excellent', 'good', 'book', 'forced'].includes(m.cls);
      this.board.setArrows(bestU && bestU !== m.uci && !good ? [{ from: bestU.slice(0, 2), to: bestU.slice(2, 4), color: 'rgba(129,182,76,.85)' }] : []);
      evalBarTo(m.cpWhiteAfter, m.mateAfter != null ? (m.color === 'w' ? -1 : 1) * m.mateAfter : null, this.orient);
      const bestSan = bestU && bestU !== m.uci ? pvSan(m.fenBefore, m.best, 4) : [];
      const ev = m.mateAfter != null && m.mateAfter !== 0 ? 'Mate in ' + Math.abs(m.mateAfter) : (m.cpWhiteAfter >= 9000 ? 'Checkmate' : (m.cpWhiteAfter > 0 ? '+' : '') + (m.cpWhiteAfter / 100).toFixed(2));
      head = `<div class="head">${clsIcon(m.cls)}<b class="t-${m.cls}">Your move ${esc(sanAt(V.base + k - 1, mv.san))}: ${CLS[m.cls].name}</b><span class="muted" style="margin-left:auto">${ev}</span></div>
        ${bestSan.length && !good ? `<p class="muted">Best was <b style="color:var(--fg)">${esc(bestSan[0])}</b>${bestSan.length > 1 ? `, continuing ${esc(bestSan.slice(1).join(' '))}` : ''}.</p>` : ''}`;
    }
    card.innerHTML = `${head}<p class="kicker" style="margin-top:4px">Your line from move ${Math.floor(V.base / 2) + 1}</p><div class="amoves varline">${line}</div>
      <div class="row-btns"><button class="btn sm" id="varBack">Back to the game</button></div>`;
    $$('.varline button', card).forEach(b => b.onclick = () => { V.cur = +b.dataset.k; this.showVar(); });
    $('#varBack').onclick = () => { const b = V.base; this.vari = null; this.to(b, true); };
    if (!m) { this.board.setBadge(null); }
  },
};

// ---------- boot ----------
$('#brand').onclick = () => go({ name: 'home' });
const gnav = $('.gnav'), burger = $('#burger');
function setMenu(open) { gnav.classList.toggle('open', open); burger.setAttribute('aria-expanded', open); }
burger.onclick = () => setMenu(!gnav.classList.contains('open'));
$('#mainLinks').addEventListener('click', () => setMenu(false));
addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
document.addEventListener('click', e => { if (!e.target.closest('.gnav')) setMenu(false); });
function jumpTo(id) {
  if (current.name === 'home' && !Trainer.active && !Explorer.active && !document.body.classList.contains('training')) {
    $('#' + id)?.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  } else { go({ name: 'home', scrollTo: id }); }
}
$('#hdrOpenings').onclick = () => jumpTo('openings');
$('#hdrReview').onclick = () => startReview();
$('#hdrAnalysis').onclick = () => jumpTo('sec-analysis');
$('#hdrPuzzles').onclick = () => jumpTo('sec-puzzles');
$('#hdrCoords').onclick = () => jumpTo('sec-coords');
addEventListener('pointerdown', () => Sound.ensure(), { once: true });
rerender();
cloud.init();

</script>
