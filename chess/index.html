<!doctype html><html><head><meta charset=utf8><meta name="description" content="Chess Companion: analyse your games, solve rated puzzles, train coordinates and learn openings."><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Chess Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: dark slate room around a blue marble board. Home = a clear "today" block, then two lists (White | Black).
   Trainer = board left, right column of three filled blocks: what to do now, your options, the score sheet. */
:root {
  --bg: #1b1f24;
  --panel: #262c33;
  --panel-2: #313841;
  --ink: #f4f7fa;
  --ink-2: #cfd7de;
  --ink-3: #9ba6b0;
  --rule: #3a424c;
  --accent: #4ea8ff;
  --accent-ink: #06121f;
  --good: #4fd17f;
  --bad: #ff6b5e;
  --gold: #ffc53d;
  --sq-light: #dce6ed;
  --sq-dark: #7697b3;
  --coord: #aab4bd;
  --hl-last: rgba(170, 200, 90, .5);
  --hl-sel: rgba(28, 58, 96, .45);
  --marble: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><filter id='f' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='0.009 0.026' numOctaves='6' seed='17' stitchTiles='stitch'/><feColorMatrix type='matrix' values='.33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 0 1'/><feComponentTransfer><feFuncR type='table' tableValues='.4 .56 .34 .62 .45 .68 .38 .52'/><feFuncG type='table' tableValues='.4 .56 .34 .62 .45 .68 .38 .52'/><feFuncB type='table' tableValues='.4 .56 .34 .62 .45 .68 .38 .52'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  --font-body: "Source Sans 3", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Source Code Pro", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 17px; line-height: 1.55; padding-inline: 16px; padding-block: 0 64px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-body); font-weight: 700; line-height: 1.2; text-wrap: balance; margin: 0; }
p { margin: 0; }
ul, ol, dl, dd { margin: 0; padding: 0; list-style: none; }
.wrap { max-width: 1160px; margin: 0 auto; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.kicker { font-size: 15px; font-weight: 600; color: var(--ink-3); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent); color: var(--accent-ink); }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 12px 32px; padding-block: 20px; flex-wrap: wrap; margin-bottom: 32px; }
.brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; cursor: pointer; font-size: 24px; font-weight: 700; }
.brand-mark { width: 28px; height: 28px; display: grid; grid-template-columns: 1fr 1fr; }
.brand-mark i { background: var(--sq-dark); } .brand-mark i:nth-child(1), .brand-mark i:nth-child(4) { background: var(--sq-light); }
.stats { margin-left: auto; display: flex; align-items: center; gap: 8px 28px; flex-wrap: wrap; font-size: 16px; color: var(--ink-2); }
.stat b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.xpline { display: inline-block; width: 64px; height: 6px; background: var(--panel-2); vertical-align: middle; margin-left: 10px; border-radius: 3px; overflow: hidden; }
.xpline i { display: block; height: 100%; background: var(--gold); transition: width .5s; }
.link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); font-weight: 600; }
.link:hover { text-decoration: underline; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 4px; border: 0; background: var(--panel-2); padding: 12px 20px; font-weight: 600; cursor: pointer; transition: background .15s, filter .15s; white-space: nowrap; }
.btn:hover { background: #3d4651; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.1); background: var(--accent); }
.btn.warm { background: var(--gold); color: #1d1500; }
.btn.warm:hover { filter: brightness(1.08); background: var(--gold); }
.btn.small { padding: 9px 16px; font-size: 16px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 32px 48px; padding: 32px; background: var(--panel); border-radius: 6px; margin-bottom: 48px; }
.hero h1 { font-size: clamp(30px, 4.4vw, 42px); margin-bottom: 12px; }
.lede { color: var(--ink-2); max-width: 52ch; margin-bottom: 24px; font-size: 18px; }
.hero-side { display: grid; gap: 24px; align-content: start; }
.goal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-size: 16px; }
.goal-head .mono { font-family: var(--font-body); font-weight: 700; color: var(--ink); }
.goalbar { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
.goalbar i { display: block; height: 100%; background: var(--good); transition: width .6s; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; max-width: 300px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-3); }
.week i { display: block; width: 100%; height: 28px; background: var(--panel-2); border-radius: 3px; }
.week i.on { background: var(--good); }
.week i.is-today { box-shadow: 0 0 0 2px var(--ink); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.facts dt { font-size: 15px; color: var(--ink-3); font-weight: 600; }
.facts dd { font-size: 28px; font-weight: 700; }
.facts dd .kicker { font-size: 16px; }
.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px 36px; margin-bottom: 48px; }
.method dt { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
.method dd { color: var(--ink-2); font-size: 16px; }
.repertoire { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 40px; margin-bottom: 48px; }
.repertoire h2 { font-size: 24px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.repertoire ul { display: grid; gap: 10px; }
.op-row { width: 100%; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 18px; padding: 14px; border: 2px solid transparent; border-radius: 6px; background: var(--panel); cursor: pointer; text-align: left; align-items: center; transition: border-color .15s, background .15s; }
.op-row:hover { border-color: var(--accent); background: #2b323a; }
.op-row h3 { font-size: 20px; }
.op-meta { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 15px; color: var(--ink-3); margin-top: 2px; }
.prog { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.prog .bar { flex: 1; height: 8px; background: var(--panel-2); display: flex; max-width: 200px; border-radius: 4px; overflow: hidden; }
.prog .bar i { height: 100%; } .prog .bar .s { background: var(--good); } .prog .bar .l { background: var(--accent); }
.mini { display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; width: 72px; align-self: start; border-radius: 3px; overflow: hidden; }
.mini div { background-color: var(--sq-light); background-size: 100% 100%; } .mini div.d { background-color: var(--sq-dark); }
.st { font-size: 15px; font-weight: 700; }
.st-new { color: var(--accent); } .st-due { color: var(--gold); } .st-strong { color: var(--good); } .st-learning { color: var(--ink-2); }

/* ---------- opening page ---------- */
.back { display: inline-flex; gap: 8px; align-items: center; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; font-size: 16px; margin-bottom: 20px; }
.back:hover { text-decoration: underline; }
.op-head { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 40px; margin-bottom: 48px; align-items: start; }
.op-head h1 { font-size: clamp(34px, 5vw, 48px); margin-block: 6px 14px; }
.op-head .mini { width: 200px; border-radius: 4px; }
.section-title { font-size: 24px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 48px; }
.plans li { color: var(--ink); background: var(--panel); padding: 16px 18px; border-radius: 6px; font-size: 16px; }
.lines-list { display: grid; gap: 10px; }
.line-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 24px; padding: 18px 20px; background: var(--panel); border-radius: 6px; align-items: center; }
.line-row h3 { font-size: 19px; display: flex; gap: 6px 14px; align-items: baseline; flex-wrap: wrap; }
.line-row .sum { color: var(--ink-2); font-size: 16px; }
.line-row .pv { font-family: var(--font-mono); font-size: 14px; color: var(--ink-3); overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.line-row .acts { display: flex; gap: 10px; grid-row: 1 / span 3; grid-column: 2; }

/* ---------- trainer ---------- */
.trainer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 28px 40px; align-items: start; }
.board-col { display: grid; gap: 16px; justify-items: center; min-width: 0; }
.board-frame { display: grid; grid-template-columns: 22px minmax(0, 1fr) 24px; grid-template-rows: auto 28px; column-gap: 8px; width: 100%; max-width: min(660px, calc(100vh - 130px)); }
.ranks, .files { display: grid; color: var(--coord); font-size: 16px; font-weight: 600; user-select: none; }
.ranks { grid-template-rows: repeat(8, 1fr); align-items: center; justify-items: center; }
.files { grid-column: 2; grid-template-columns: repeat(8, 1fr); align-items: end; justify-items: center; }
.evalbar { background: #0c0e10; position: relative; overflow: hidden; transition: opacity .3s; border-radius: 2px; }
.evalbar i { position: absolute; left: 0; right: 0; bottom: 0; background: #f4f7fa; transition: height .4s ease; }
.evalbar.flip i { top: 0; bottom: auto; }
.evalbar.off { opacity: 0; visibility: hidden; }
.board { position: relative; width: 100%; aspect-ratio: 1; user-select: none; -webkit-user-select: none; touch-action: none; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
.board.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.squares { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
.sq { position: relative; background-color: var(--sq-light); background-image: var(--marble); background-size: 600% 600%; background-blend-mode: overlay; }
.sq.d { background-color: var(--sq-dark); background-blend-mode: soft-light; }
.sq.last::after, .sq.sel::after, .sq.hint::after, .sq.wrong::after, .sq.good::after, .sq.check::after { content: ""; position: absolute; inset: 0; }
.sq.last::after { background: var(--hl-last); }
.sq.sel::after { background: var(--hl-sel); }
.sq.hint::after { box-shadow: inset 0 0 0 4px var(--gold); animation: pulse 1s ease-in-out infinite; }
.sq.wrong::after { background: rgba(230, 60, 45, .6); animation: fade .9s forwards; }
.sq.good::after { background: rgba(60, 200, 110, .5); animation: fade 1.1s forwards; }
.sq.check::after { background: radial-gradient(circle, rgba(255,0,0,.8) 0%, rgba(230,0,0,.4) 40%, transparent 72%); }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 7px var(--gold); } }
@keyframes fade { to { opacity: 0; } }
.sq .dot { position: absolute; inset: 37%; border-radius: 50%; background: rgba(20, 38, 60, .38); pointer-events: none; }
.sq .ring2 { position: absolute; inset: 4%; border-radius: 50%; border: 5px solid rgba(20, 38, 60, .38); pointer-events: none; }
.pieces { position: absolute; inset: 0; pointer-events: none; }
.pc { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; background-size: 100% 100%; will-change: transform; transition: transform .2s cubic-bezier(.3,.7,.3,1); z-index: 2; }
.pc.drag { transition: none; z-index: 10; cursor: grabbing; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
.pc.gone { opacity: 0; transition: opacity .2s; }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.float-xp { position: absolute; z-index: 20; font-weight: 700; color: #fff; font-size: 22px; pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,.6); animation: rise 1s ease-out forwards; }
@keyframes rise { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -48px); opacity: 0; } }
.board-ctrl { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.panel { display: grid; gap: 14px; min-width: 0; }
.p-head { display: grid; gap: 8px; }
.p-head .kicker { display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: baseline; }
.mode { font-weight: 700; } .mode-learn { color: var(--accent); } .mode-drill { color: var(--good); } .mode-explore { color: var(--gold); } .mode-weak { color: var(--bad); }
.p-head h2 { font-size: 26px; }
.combo { margin-left: auto; color: var(--gold); font-weight: 700; }
.combo.pop { animation: pop .3s; }
@keyframes pop { 50% { transform: scale(1.2); } }
.progress { display: flex; gap: 3px; margin-top: 4px; }
.progress i { flex: 1; height: 8px; background: var(--panel-2); border-radius: 2px; transition: background .2s; }
.progress i.u { background: #56606b; }
.progress i.done { background: var(--good); } .progress i.hinted { background: var(--gold); } .progress i.miss { background: var(--bad); }
.progress i.now { background: var(--accent); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .4; } }
.coach { display: grid; gap: 12px; padding: 20px 22px; background: var(--panel); border-radius: 6px; border-top: 4px solid var(--panel-2); min-height: 150px; align-content: start; }
.coach.good { border-top-color: var(--good); } .coach.bad { border-top-color: var(--bad); } .coach.gold { border-top-color: var(--gold); }
.coach-title { font-size: 24px; display: flex; gap: 8px 12px; align-items: baseline; flex-wrap: wrap; }
.coach.good .coach-title { color: var(--good); } .coach.bad .coach-title { color: var(--bad); } .coach.gold .coach-title { color: var(--gold); }
.san { font-family: var(--font-mono); font-weight: 600; font-size: 20px; color: var(--ink); background: var(--panel-2); padding: 1px 10px; border-radius: 3px; }
.coach-text { color: var(--ink); font-size: 18px; }
.note { font-size: 16px; color: var(--ink-2); padding-top: 10px; border-top: 1px solid var(--rule); }
.note b { font-family: var(--font-mono); font-weight: 600; color: var(--ink); }
.sect { display: grid; gap: 12px; padding: 18px 22px; background: var(--panel); border-radius: 6px; }
.sect-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sect-head .kicker { color: var(--ink); font-size: 17px; font-weight: 700; }
.opts { display: block; }
.opts > * + * { margin-top: 8px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: baseline; padding: 12px 14px; background: var(--panel-2); border: 2px solid transparent; border-radius: 4px; cursor: pointer; text-align: left; width: 100%; }
.opt:hover { border-color: var(--ink-3); }
.opt.rep { border-color: var(--accent); }
.san2 { font-family: var(--font-mono); font-weight: 600; font-size: 18px; min-width: 56px; }
.opt .why { grid-column: 1 / -1; font-size: 16px; color: var(--ink-2); }
.ev { font-family: var(--font-mono); font-weight: 600; font-size: 16px; color: var(--ink-2); }
.ev.pos { color: var(--good); } .ev.neg { color: var(--bad); }
.opt .kind { font-size: 15px; color: var(--ink-3); font-weight: 600; }
.opt.rep .kind { color: var(--accent); }
.opt .pvline { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 14px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.veil { display: grid; gap: 14px; justify-items: start; color: var(--ink-2); font-size: 16px; }
.sheet { display: grid; grid-template-columns: 40px 1fr 1fr; font-family: var(--font-mono); font-size: 16px; max-height: 240px; overflow-y: auto; row-gap: 2px; }
.sheet div { padding: 3px 8px; }
.sheet .n { color: var(--ink-3); text-align: right; padding-right: 12px; }
.sheet .m.ok { color: var(--good); } .sheet .m.hint { color: var(--gold); } .sheet .m.miss { color: var(--bad); }
.sheet .m.ghost { color: var(--ink-3); }
.switch { display: inline-flex; align-items: center; gap: 10px; font-size: 16px; cursor: pointer; color: var(--ink-2); }
.switch input { appearance: none; width: 40px; height: 22px; background: #4a535e; position: relative; cursor: pointer; transition: background .15s; margin: 0; border-radius: 11px; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tally dt { font-size: 14px; color: var(--ink-3); font-weight: 600; }
.tally dd { font-size: 24px; font-weight: 700; }
.empty { color: var(--ink-3); font-size: 16px; }
.engine-note { font-size: 14px; color: var(--ink-3); }
.spinner { width: 12px; height: 12px; border: 2px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: -1px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 100; width: 100%; height: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 20px; font-weight: 600; z-index: 50; border-radius: 4px; animation: toastin .25s; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
@keyframes toastin { from { transform: translate(-50%, 12px); opacity: 0; } }

.evalbar b { position: absolute; left: 0; right: 0; text-align: center; font: 700 10px/1 var(--font-body); letter-spacing: -.02em; z-index: 1; }
.evalbar b.w { bottom: 4px; color: #1b1f24; } .evalbar b.b { top: 4px; color: #f4f7fa; }
.evalbar.flip b.w { top: 4px; bottom: auto; } .evalbar.flip b.b { bottom: 4px; top: auto; }
.trap-tag { display: inline-block; font-size: .6em; vertical-align: .2em; color: #1d1500; background: var(--gold); padding: 1px 8px; border-radius: 3px; }
.opt .kind.trap { color: var(--gold); }
.traps-title { margin-top: 48px; }
.traps-lede { margin-bottom: 16px; }
.traps-actions { margin-bottom: 16px; }
.seg { display: inline-flex; background: var(--panel); border-radius: 4px; padding: 3px; gap: 3px; justify-self: start; margin-top: 6px; }
.seg button { border: 0; background: none; padding: 8px 14px; border-radius: 3px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.loader { display: grid; gap: 8px; }
.loader label { font-size: 15px; color: var(--ink-2); }
.loader textarea { width: 100%; font: 15px/1.5 var(--font-mono); color: var(--ink); background: var(--bg); border: 2px solid var(--panel-2); border-radius: 4px; padding: 10px 12px; resize: vertical; }
.loader textarea:focus { border-color: var(--accent); outline: none; }
.load-msg { font-size: 15px; color: var(--gold); }
.load-msg:empty { display: none; }
@media (max-width: 900px) {
  .trainer { grid-template-columns: minmax(0, 1fr); }
  .board-frame { max-width: 580px; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .repertoire { grid-template-columns: minmax(0, 1fr); }
  .op-head { grid-template-columns: minmax(0, 1fr); }
  .op-head .mini { display: none; }
}
@media (max-width: 520px) {
  body { font-size: 16px; }
  .hero { padding: 22px 18px; }
  .line-row { grid-template-columns: minmax(0, 1fr); }
  .line-row .acts { grid-row: auto; grid-column: 1; margin-top: 8px; }
  .line-row .pv { display: none; }
  .stats { margin-left: 0; gap: 6px 18px; font-size: 15px; }
  .op-row { grid-template-columns: 60px minmax(0, 1fr); } .op-row .mini { width: 60px; }
  .board-frame { grid-template-columns: 16px minmax(0, 1fr) 20px; column-gap: 5px; grid-template-rows: auto 24px; }
  .ranks, .files { font-size: 13px; }
  .coach, .sect { padding: 16px; }
  body.training .stats { display: none; }
  body.training .topbar { padding-block: 12px; margin-bottom: 14px; }
}

/* ---------- stripped-down layout (overrides) ---------- */
.topbar { margin-bottom: 24px; }
.home-actions { margin-bottom: 28px; }
.repertoire h2 { font-size: 20px; color: var(--ink-3); margin-bottom: 8px; }
.repertoire ul { gap: 0; }
.op-row { grid-template-columns: 56px minmax(0, 1fr) auto 120px; gap: 16px; padding: 10px 8px; background: none; border: 0; border-radius: 4px; }
.op-row:hover { background: var(--panel); border: 0; }
.op-row .mini { width: 56px; }
.op-name { font-size: 19px; font-weight: 600; }
.op-row .bar { height: 6px; background: var(--panel-2); display: flex; border-radius: 3px; overflow: hidden; }
.op-row .bar i { height: 100%; } .op-row .bar .s { background: var(--good); } .op-row .bar .l { background: var(--accent); }
.back { font-size: 20px; margin-bottom: 8px; }
.op-head { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.op-head h1 { margin: 0; }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 32px; margin-bottom: 36px; }
.plans li { background: none; padding: 0 0 0 18px; position: relative; color: var(--ink-2); font-size: 16px; }
.plans li::before { content: ""; position: absolute; left: 0; top: .6em; width: 8px; height: 8px; background: var(--sq-dark); }
.section-title { display: flex; align-items: center; gap: 16px; justify-content: flex-start; font-size: 20px; color: var(--ink-3); margin-bottom: 4px; }
.lines-list { gap: 0; margin-bottom: 36px; }
.line-row { display: flex; align-items: center; gap: 12px; padding: 8px 8px; background: none; border-radius: 4px; }
.line-row:hover { background: var(--panel); }
.line-name { font-size: 17px; font-weight: 600; }
.line-row .acts { margin-left: auto; grid-row: auto; grid-column: auto; }
.panel { gap: 18px; }
.p-head h2 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.count { font-size: 15px; color: var(--ink-3); font-weight: 400; }
.combo { font-size: 18px; }
.coach { background: none; border-top: 0; padding: 0; min-height: 110px; border-radius: 0; }
.coach-title { font-size: 22px; }
.note { border-top: 0; padding-top: 0; }
.sect { background: none; padding: 0; border-radius: 0; }
.sect:empty { display: none; }
.veil { justify-items: start; }
.nav { display: inline-flex; gap: 4px; }
.nav .btn { padding-inline: 12px; font-size: 14px; }
.board.viewing { outline: 3px solid var(--gold); outline-offset: 3px; }
.sheet { grid-template-columns: 40px 1fr 1fr; max-height: 260px; }
.sheet button.m { border: 0; background: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer; padding: 3px 8px; border-radius: 3px; }
.sheet button.m:hover { background: var(--panel-2); }
.sheet .m.cur { background: var(--accent); color: var(--accent-ink); }
.sheet .m.ghost { color: var(--ink-3); }
#sheet[hidden] { display: none; }
@media (max-width: 520px) {
  .op-row { grid-template-columns: 48px minmax(0, 1fr) auto 64px; gap: 12px; }
  .op-row .mini { width: 48px; }
  .line-row { flex-wrap: nowrap; align-items: flex-start; }
  .line-text { flex: 1 1 0; }
  .line-row .acts { gap: 6px; }
  .line-row .acts .btn { padding: 8px 12px; }
  .when { display: none; }
  .about { margin-top: 4px; }
}
/* ---------- added context text ---------- */
.op-text { display: grid; gap: 2px; min-width: 0; }
.op-moves, .line-sum { font-size: 14px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op-moves { font-family: var(--font-mono); }
.op-prog { display: grid; gap: 4px; }
.op-prog small { font-size: 13px; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.home-lede { color: var(--ink-3); font-size: 16px; margin-bottom: 24px; }
.about { color: var(--ink-2); max-width: 68ch; margin: -8px 0 28px; font-size: 17px; }
.eco { font-size: 15px; font-weight: 600; color: var(--ink-3); margin-left: 12px; vertical-align: .3em; }
.line-text { display: grid; min-width: 0; flex: 1 1 260px; }
.line-sum { white-space: normal; }
.when { font-size: 14px; color: var(--ink-3); white-space: nowrap; }
.p-head .mode { font-size: 15px; }
.book-of { font-size: 15px; color: var(--ink-3); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ================= Linear-style layer: dark, one light-blue accent, pill buttons, glass header. The playing board keeps its own look. ================= */
:root {
  --bg: #08090A; --bg-2: #0F1011; --bg-3: #15161A;
  --ink: #F7F8F8; --ink-2: #B4B8C0; --ink-3: #8A8F98; --ink-4: #5A5F68;
  --fg: #F7F8F8; --fg-2: #B4B8C0; --fg-3: #8A8F98; --fg-4: #5A5F68;
  --panel: rgba(255, 255, 255, .025); --panel-2: rgba(255, 255, 255, .06);
  --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .16); --rule: var(--line);
  --glow: rgba(94, 106, 210, .18);
  --sky: #9CCBFF; --sky-ink: #06101C; --sky-wash: rgba(156, 203, 255, .32);
  --accent: var(--sky); --accent-ink: var(--sky-ink);
  --good: #6FDB9F; --bad: #FF8A80; --gold: #F5C76B;
  --thumb-l: #D9DEE8; --thumb-d: #8D99B0;
  --font-hero: "Geist", "Inter Tight", system-ui, sans-serif;
  --font-display: "Inter Tight", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: var(--font-body); /* no monospace anywhere: notation uses tabular figures instead */
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
html { background: var(--bg); }
body { font-variant-numeric: tabular-nums; color: var(--fg); font: 400 15px/1.6 var(--font-body); letter-spacing: -.006em; padding-inline: 24px; padding-block: 0 96px; overflow-x: hidden;
  background: radial-gradient(70% 520px at 50% 360px, var(--glow), transparent 70%), linear-gradient(180deg, var(--bg-2), var(--bg) 900px) var(--bg); background-repeat: no-repeat; }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -.03em; color: var(--fg); }
.mono { font-family: var(--font-mono); }
.kicker { font: 500 12px/1 var(--font-mono); color: var(--fg-3); text-transform: uppercase; letter-spacing: .1em; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }
::selection { background: var(--sky); color: var(--sky-ink); }
.wrap { max-width: 1160px; }

/* ---------- glass header ---------- */
.gnav { position: sticky; top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 40; height: 60px; max-width: 1080px; margin: 14px auto 0; padding: 0 8px 0 20px; border-radius: 999px;
  display: flex; align-items: center; gap: 24px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .015)), rgba(16, 18, 24, .16);
  -webkit-backdrop-filter: blur(14px) saturate(170%); backdrop-filter: blur(14px) saturate(170%);
  border: 1px solid transparent;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 0 20px rgba(255, 255, 255, .025), 0 12px 40px rgba(0, 0, 0, .3); }
.gnav::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px;
  background: linear-gradient(110deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, .08));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.gnav > * { position: relative; z-index: 1; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 15px/1 var(--font-display); letter-spacing: -.01em; color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer; }
.brand svg { width: 18px; height: 18px; }
.links { display: flex; gap: 4px; }
.links button { background: none; border: 0; color: var(--fg-3); font: 500 14px/1 var(--font-body); padding: 8px 12px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s; display: inline-flex; align-items: center; gap: 6px; }
.links button:hover { background: rgba(255, 255, 255, .08); color: var(--fg); }
.links .badge { font: 600 11px/1 var(--font-mono); color: var(--sky-ink); background: var(--sky); padding: 3px 6px; border-radius: 99px; }
.nav-r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.stats { margin: 0; gap: 0; }
#soundBtn { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; color: var(--fg-3); transition: background .2s, color .2s; }
#soundBtn:hover { background: rgba(255, 255, 255, .08); color: var(--fg); }
#soundBtn svg { width: 18px; height: 18px; }

/* ---------- pill buttons: light-blue fill, or clear with a white border ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; min-width: 0; padding: 0 22px; border-radius: 999px; font: 500 14px/1 var(--font-body); letter-spacing: -.006em; white-space: nowrap; cursor: pointer;
  border: 1px solid rgba(255, 255, 255, .85); background: transparent; color: var(--fg); text-transform: none;
  transition: background .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease), border-color .25s, transform .15s; }
.btn:hover { background: rgba(255, 255, 255, .08); border-color: #fff; filter: none; }
.btn:active { transform: scale(.98); }
.btn.primary, .btn.sky, .btn.warm { background: var(--sky); border-color: var(--sky); color: var(--sky-ink); font-weight: 600; }
.btn.primary:hover, .btn.sky:hover, .btn.warm:hover { background: #B7D9FF; border-color: #B7D9FF; box-shadow: 0 0 0 4px rgba(156, 203, 255, .16), 0 8px 26px rgba(156, 203, 255, .28); filter: none; }
.btn.small, .btn.sm { height: 34px; padding: 0 16px; font-size: 13px; }
.btn.lg { height: 50px; padding: 0 36px; font-size: 15px; }
.btn.card-btn { height: 40px; min-width: 104px; padding: 0 26px; }
.btn:disabled { opacity: .35; background: transparent; border-color: rgba(255, 255, 255, .5); color: var(--fg); box-shadow: none; }
.btn .arr { transition: transform .25s var(--ease); }
.btn:hover .arr { transform: translateX(3px); }
.link { color: var(--sky); font-weight: 500; }
.back { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .25); color: var(--fg-2); font: 500 13px/1 var(--font-body); margin: 28px 0 24px; transition: border-color .2s, color .2s, background .2s; }
.back:hover { text-decoration: none; border-color: #fff; color: var(--fg); background: rgba(255, 255, 255, .05); }
.actions { gap: 10px; }

/* ---------- home ---------- */
.lhero { display: grid; justify-items: center; text-align: center; gap: 22px; padding-top: 88px; }
.lhero h1 { font: 600 clamp(44px, 7.2vw, 88px)/1 var(--font-hero); letter-spacing: -.055em; margin: 0; text-wrap: balance;
  background: linear-gradient(180deg, #FFFFFF 30%, rgba(255, 255, 255, .6)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lhero h1 .accent { background: linear-gradient(100deg, #FFFFFF 0%, #CFE5FF 45%, var(--sky) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .04em; }
.sub { font-size: 18px; line-height: 1.55; color: var(--fg-3); max-width: 52ch; margin: 0; text-wrap: pretty; }
.sub strong { color: var(--fg-2); font-weight: 500; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.stage { position: relative; height: clamp(360px, 46vw, 560px); width: 100vw; margin: 12px 0 0 calc(50% - 50vw); cursor: grab; touch-action: pan-y;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 14%, #000 72%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 14%, #000 72%, transparent 100%); }
.stage.grabbing { cursor: grabbing; }
.stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
.openings { margin-top: 40px; display: grid; gap: 64px; }
.sec-head { display: grid; justify-items: center; text-align: center; gap: 12px; }
.sec-head h2 { font: 600 clamp(28px, 3.8vw, 42px)/1.1 var(--font-display); letter-spacing: -.035em; margin: 0; }
.sec-head .sub { font-size: 16px; }
.side { display: grid; gap: 22px; }
.side-label { display: flex; align-items: center; justify-content: center; gap: 14px; font: 500 12px/1 var(--font-mono); color: var(--fg-3); text-transform: uppercase; letter-spacing: .14em; margin: 0; }
.side-label::before, .side-label::after { content: ""; width: 72px; height: 1px; background: linear-gradient(90deg, transparent, var(--line-2)); }
.side-label::after { background: linear-gradient(90deg, var(--line-2), transparent); }
.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; list-style: none; margin: 0; padding: 0; }
.cards > li { flex: 0 1 262px; display: flex; }
.thumb { position: relative; display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; width: 100%; max-width: 100%; overflow: hidden; }
.thumb i { background-color: var(--thumb-l); background-size: 100% 100%; background-repeat: no-repeat; position: relative; }
.thumb i.d { background-color: var(--thumb-d); }
.thumb i.mv::after { content: ""; position: absolute; inset: 0; background: var(--sky-wash); }
.thumb i.to::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--sky); }
.card { position: relative; width: 100%; display: grid; justify-items: center; align-content: start; text-align: center; gap: 16px; padding: 8px 6px 10px; cursor: pointer; }
.card .tilt { width: 82%; perspective: 700px; padding: 14px 0 26px; position: relative; }
.card .tilt::after { content: ""; position: absolute; left: 6%; right: 6%; bottom: 4px; height: 26px; background: radial-gradient(closest-side, rgba(156, 203, 255, .32), transparent); filter: blur(4px); transition: opacity .4s; opacity: .6; }
.card .tilt .thumb { border-radius: 8px; transform: rotateX(46deg); transform-origin: 50% 70%; box-shadow: 0 0 0 1px rgba(255, 255, 255, .14), 0 30px 40px rgba(0, 0, 0, .55); transition: transform .5s var(--ease); }
.card:hover .tilt .thumb { transform: rotateX(28deg) translateY(-6px); }
.card:hover .tilt::after { opacity: 1; }
.card .txt { display: grid; gap: 8px; justify-items: center; width: 100%; }
.card .move { font: 500 12px/1 var(--font-mono); color: var(--sky); }
.card .name { font: 600 19px/1.2 var(--font-display); letter-spacing: -.02em; margin: 0; }
.lcount { font: 500 13px/1 var(--font-body); color: var(--fg-2); margin: 0; }
.lcount .due { color: var(--gold); }
.segbar { display: grid; gap: 8px; justify-items: center; width: 74%; margin-top: 6px; }
.segs { display: flex; gap: 4px; width: 100%; }
.segs i { flex: 1; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, .1); transition: background .3s; }
.segs i.on { background: var(--sky); box-shadow: 0 0 10px rgba(156, 203, 255, .45); }
.segs i.strong { background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, .4); }
.seg-label { font: 400 11px/1 var(--font-mono); color: var(--fg-4); letter-spacing: .04em; }
.card .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }

/* ---------- opening page ---------- */
.ohead { display: grid; justify-items: center; text-align: center; gap: 18px; margin-bottom: 56px; }
.ohead .tilt { width: min(300px, 70vw); perspective: 800px; padding: 6px 0 30px; position: relative; }
.ohead .tilt::after { content: ""; position: absolute; left: 4%; right: 4%; bottom: 6px; height: 30px; background: radial-gradient(closest-side, rgba(156, 203, 255, .35), transparent); filter: blur(5px); }
.ohead .tilt .thumb { border-radius: 10px; transform: rotateX(38deg); transform-origin: 50% 70%; box-shadow: 0 0 0 1px rgba(255, 255, 255, .14), 0 30px 50px rgba(0, 0, 0, .6); }
.ohead h1 { font: 600 clamp(40px, 6vw, 72px)/1 var(--font-hero); letter-spacing: -.05em; margin: 0; background: linear-gradient(180deg, #FFFFFF 35%, rgba(255, 255, 255, .62)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ohead .meta { font: 500 12px/1 var(--font-mono); color: var(--fg-3); letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.ohead .meta b { color: var(--sky); font-weight: 500; }
.ohead .about { max-width: 62ch; color: var(--fg-3); font-size: 17px; line-height: 1.65; margin: 0; text-align: center; }
.ohead .actions { justify-content: center; margin-top: 6px; }
.block { margin-bottom: 64px; display: grid; gap: 22px; }
.block-head { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.block-head .side-label { margin: 0; }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: plan; }
.plans li { position: relative; padding: 20px 20px 22px; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, .01)); color: var(--fg-2); font-size: 15px; line-height: 1.6; display: grid; gap: 10px; }
.plans li::before { content: counter(plan, decimal-leading-zero); counter-increment: plan; position: static; width: auto; height: auto; background: none; font: 500 12px/1 var(--font-mono); color: var(--sky); }
.rows { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: rgba(255, 255, 255, .015); margin: 0; padding: 0; list-style: none; }
.lrow { display: grid; grid-template-columns: 18px 28px minmax(0, 1fr) auto auto; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--line); transition: background .15s; }
.lrow:last-child { border-bottom: 0; }
.lrow:hover { background: rgba(255, 255, 255, .025); }
.lrow .n { font: 500 12px/1 var(--font-mono); color: var(--fg-4); }
.lrow .t { display: grid; gap: 3px; min-width: 0; }
.lrow .nm { font: 600 16px/1.3 var(--font-display); letter-spacing: -.015em; color: var(--fg); }
.line-card .lsum { font-size: 14px; line-height: 1.5; color: var(--fg-3); margin: 0; max-width: 30ch; text-wrap: pretty; }

.profile h3 { font-size: 22px; }
.profile .who-sel { background: rgba(0, 0, 0, .3); color: var(--fg); border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 14px; font: 500 13px var(--font-body); }
.wdl { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: rgba(255, 255, 255, .08); }
.wdl i:nth-child(1) { background: var(--good); } .wdl i:nth-child(2) { background: var(--fg-4); } .wdl i:nth-child(3) { background: var(--bad); }
.spark { width: 100%; height: 64px; display: block; }
.openings-top { display: flex; gap: 6px; flex-wrap: wrap; }
.glist { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: rgba(255, 255, 255, .015); }
.grow { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; color: inherit; text-align: left; font: inherit; }
.grow:last-child { border-bottom: 0; }
.grow:hover { background: rgba(255, 255, 255, .035); }
.res { display: grid; place-items: center; height: 30px; border-radius: 999px; font: 600 12px/1 var(--font-body); }
.res.win { background: rgba(111, 219, 159, .16); color: var(--good); } .res.loss { background: rgba(255, 138, 128, .14); color: var(--bad); } .res.draw { background: rgba(255, 255, 255, .08); color: var(--fg-2); }
.grow .vs { display: grid; gap: 3px; min-width: 0; }
.grow .vs b { font: 600 15px/1.25 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow .vs span { font-size: 13px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot-side { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; border: 1px solid rgba(255, 255, 255, .6); }
.dot-side.w { background: #fff; } .dot-side.b { background: #111; }
.acc-chip { font-size: 13px; color: var(--fg-2); white-space: nowrap; }
.acc-chip b { color: var(--sky); font-weight: 600; }
.grow .go { color: var(--fg-3); }
.lib-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
@media (max-width: 560px) {
  .profile { grid-template-columns: auto minmax(0, 1fr); }
  .profile .who { grid-column: 1 / -1; }
  .grow { grid-template-columns: 48px minmax(0, 1fr) auto; }
  .grow .go { display: none; }
}

/* page background reaches the bottom on short pages */
body { min-height: 100vh; min-height: 100dvh; }
/* bigger board when the board and panel stack */
@media (max-width: 900px) { .board-frame { max-width: min(100%, 760px); } }
/* grade icons: larger ! and ? */
.cls { width: 24px; height: 24px; font-size: 13px; letter-spacing: -.08em; }
.amoves .cls { width: 20px; height: 20px; font-size: 11px; }
.amoves .cls svg { width: 12px; height: 12px; }
.badge-sq { font-size: 13px; letter-spacing: -.08em; min-width: 22px; min-height: 22px; width: 5%; height: 5%; }
/* compact accuracy */
.acc div { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; gap: 10px; }
.acc span { font-size: 13px; opacity: .75; }
.acc b { font-size: 22px; }
/* graph with round dots */
.graph-wrap { position: relative; border-radius: 12px; overflow: hidden; cursor: pointer; }
.graph-wrap .graph { border-radius: 0; }
.gdots { position: absolute; inset: 0; pointer-events: none; }
.gdots i { position: absolute; width: 9px; height: 9px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .35); }
/* right-click drawings */
.board .drawn { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }
/* your own line in the review */
.varline { max-height: none; margin-top: 2px; }
.mv-card .try { font-size: 13px; }
.mv-card .head .spinner { margin: 0; }
/* analysis loader */
.an-load { max-width: 560px; margin: 10px auto 0; display: grid; justify-items: center; gap: 10px; text-align: center; }
.load-stage { width: min(360px, 80vw); height: min(360px, 80vw); position: relative; }
.load-stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
.load-pct { margin: -12px 0 0; font: 600 44px/1 var(--font-hero); letter-spacing: -.04em; background: linear-gradient(180deg, #fff 30%, var(--sky)); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; }
.an-load h3 { margin: 0; font: 600 20px/1.2 var(--font-display); }
.an-load .coord-timer { width: 100%; }

.varline { display: flex; flex-wrap: wrap; gap: 4px; }
.varline button { white-space: nowrap; }
.load-stage { -webkit-mask-image: radial-gradient(closest-side, #000 60%, transparent); mask-image: radial-gradient(closest-side, #000 60%, transparent); }

/* back buttons line up with the header's left edge */
#view > .back, .tool-head { margin-left: max(0px, calc((100% - 1080px) / 2)); }
.tool-head { max-width: 1080px; }
/* breathing room around the game filters */
.lib-tools { margin: 14px 0 6px; }
/* rating chart hover */
.spark-wrap { position: relative; cursor: crosshair; }
.spark-dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--sky); box-shadow: 0 0 0 3px rgba(156, 203, 255, .3); transform: translate(-50%, -50%); pointer-events: none; }
.spark-tip { position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); display: grid; gap: 2px; padding: 8px 12px; border-radius: 12px; background: #16181d; border: 1px solid var(--line-2); box-shadow: 0 10px 24px rgba(0, 0, 0, .5); white-space: nowrap; pointer-events: none; font-size: 13px; z-index: 5; }
.spark-tip b { font: 600 18px/1.1 var(--font-display); }
.spark-tip span { color: var(--fg-3); font-size: 12px; }
.spark-tip .up, .spark-tip .down { font-size: 13px; font-weight: 600; } .spark-tip .up { color: var(--good); } .spark-tip .down { color: var(--bad); }
.spark-tip.right { transform: translateX(-100%); } .spark-tip.left { transform: none; }
/* saturated dots on the evaluation graph */
.gdots i { width: 10px; height: 10px; box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0, 0, 0, .5); }
.gdots i.c-blunder { background: #FF1A0A; } .gdots i.c-mistake { background: #FF8000; } .gdots i.c-miss { background: #FF2D55; }
.gdots i.c-brilliant { background: #00C2B8; } .gdots i.c-great { background: #1E7BFF; }

<script>
const BOOK = [{"id":"italian","name":"Italian Game","side":"w","eco":"C50–C54","about":"The Italian points the c4 bishop at f7, the square only Black's king defends. Modern players build slowly with c3 and d3, castle, then reroute the b1 knight to g3 and pick the right moment for d4. It is a quiet, flexible opening that teaches the core ideas of open games.","plans":["Prepare d4 with c3 so you can rebuild the full centre.","Reroute the knight b1–d2–f1–g3 to join a kingside attack.","Tuck the bishop back to b3 (or a2 after a4) so ...Na5 and ...d5 never come with tempo.","Play h3 to stop ...Bg4 pinning your f3 knight."],"lines":[{"name":"Giuoco Pianissimo","summary":"Slow build-up with c3, d3, Re1 and the knight trip to g3.","moves":[["e4","e2e4","Takes the centre and opens lines for the queen and the f1 bishop."],["e5","e7e5","Black claims the same central space."],["Nf3","g1f3","Develops and attacks e5 straight away."],["Nc6","b8c6","Defends e5 while developing."],["Bc4","f1c4","The Italian bishop. It eyes f7, which only the black king defends."],["Bc5","f8c5","The Giuoco Piano: Black copies and aims at f2."],["c3","c2c3","Prepares d4 and takes the d4 square away from Black's knight."],["Nf6","g8f6","Develops and hits e4."],["d3","d2d3","The calm approach: e4 is safe and you keep all your options. 5.d4 is sharper."],["d6","d7d6","Supports e5 and frees the c8 bishop."],["O-O","e1g1","King to safety. The f1 rook can now join the centre."],["O-O","e8g8",""],["Re1","f1e1","The rook backs up e4 and frees f1 for the knight's trip."],["a6","a7a6","Makes room on a7 so the bishop can't be hit by b4 or d4-d5."],["Bb3","c4b3","Step back before ...Na5 or ...b5 gains time against the bishop."],["Ba7","c5a7",""],["h3","h2h3","Stops ...Bg4, which would pin your knight and weaken control of d4."],["h6","h7h6","Black does the same against Bg5."],["Nbd2","b1d2","The knight starts its classic route: d2, f1, g3."]],"id":"italian-0"},{"name":"Two Knights, quiet 4.d3","summary":"Meet 3...Nf6 with 4.d3 and transpose into the same slow structure.","moves":[["e4","e2e4","Takes the centre and opens lines for the queen and the f1 bishop."],["e5","e7e5","Black claims the same central space."],["Nf3","g1f3","Develops and attacks e5 straight away."],["Nc6","b8c6","Defends e5 while developing."],["Bc4","f1c4","The Italian bishop. It eyes f7, which only the black king defends."],["Nf6","g8f6","The Two Knights Defence. Black attacks e4 at once."],["d3","d2d3","Simply defends e4. No need to enter the wild 4.Ng5 lines."],["Be7","f8e7","A modest, solid set-up."],["O-O","e1g1","Castle before starting anything in the centre."],["O-O","e8g8",""],["Re1","f1e1","Extra support for e4. The rook will love an open e-file later."],["d6","d7d6",""],["c3","c2c3","Prepares d4 and gives the bishop a retreat on c2."],["Na5","c6a5","Black chases your strong bishop."],["Bb5","c4b5","Keep the bishop. It will settle on c2 after ...a6 and ...b5."],["a6","a7a6",""],["Ba4","b5a4","Keep the bishop on the a4–e8 diagonal. After ...b5 it drops back to c2."],["b5","b7b5",""],["Bc2","a4c2","On c2 the bishop is safe and still aims at the kingside."]],"id":"italian-1"},{"name":"Two Knights into the Pianissimo","summary":"3...Nf6 4.d3 Bc5 reaches the main line by another road.","moves":[["e4","e2e4","Takes the centre and opens lines for the queen and the f1 bishop."],["e5","e7e5","Black claims the same central space."],["Nf3","g1f3","Develops and attacks e5 straight away."],["Nc6","b8c6","Defends e5 while developing."],["Bc4","f1c4","The Italian bishop. It eyes f7, which only the black king defends."],["Nf6","g8f6","The Two Knights Defence. Black attacks e4 at once."],["d3","d2d3","Simply defends e4. No need to enter the wild 4.Ng5 lines."],["Bc5","f8c5","Black's bishop goes to c5 after all."],["c3","c2c3","Same plan: prepare d4. This is the Giuoco Pianissimo by transposition."],["d6","d7d6","Supports e5 and frees the c8 bishop."],["O-O","e1g1","King to safety. The f1 rook can now join the centre."],["O-O","e8g8",""],["Re1","f1e1","The rook backs up e4 and frees f1 for the knight's trip."],["a6","a7a6","Makes room on a7 so the bishop can't be hit by b4 or d4-d5."],["Bb3","c4b3","Step back before ...Na5 or ...b5 gains time against the bishop."],["Ba7","c5a7",""],["h3","h2h3","Stops ...Bg4, which would pin your knight and weaken control of d4."],["h6","h7h6","Black does the same against Bg5."],["Nbd2","b1d2","The knight starts its classic route: d2, f1, g3."]],"id":"italian-2"},{"name":"Passive 3...Be7","summary":"Punish the passive bishop by opening the centre with d4 at once.","moves":[["e4","e2e4","Takes the centre and opens lines for the queen and the f1 bishop."],["e5","e7e5","Black claims the same central space."],["Nf3","g1f3","Develops and attacks e5 straight away."],["Nc6","b8c6","Defends e5 while developing."],["Bc4","f1c4","The Italian bishop. It eyes f7, which only the black king defends."],["Be7","f8e7","The Hungarian Defence. Solid but passive."],["d4","d2d4","With Black's bishop shut in, strike in the centre right away."],["exd4","e5d4",""],["Nxd4","f3d4","Recapture with a piece and keep a lead in development."],["Nf6","g8f6",""],["Nc3","b1c3","Defends e4 and develops. White has easy, active play."],["O-O","e8g8",""],["O-O","e1g1","Both sides castled, but White's pieces are freer."]],"id":"italian-3"},{"name":"Blackburne Shilling Gambit","summary":"3...Nd4 baits 4.Nxe5?? Qg5!. Take the knight instead.","trap":true,"moves":[["e4","e2e4","Takes the centre and opens lines for the queen and the f1 bishop."],["e5","e7e5","Black claims the same central space."],["Nf3","g1f3","Develops and attacks e5 straight away."],["Nc6","b8c6","Defends e5 while developing."],["Bc4","f1c4","The Italian bishop. It eyes f7, which only the black king defends."],["Nd4","c6d4","A cheap trap. 4.Nxe5?? Qg5! wins material because of the threats on g2 and f2."],["Nxd4","f3d4","Just trade. Black has moved the same knight twice for nothing."],["exd4","e5d4",""],["c3","c2c3","Attacks the isolated d4 pawn and opens lines for your pieces."],["dxc3","d4c3",""],["Nxc3","b1c3","You now lead clearly in development and own the centre."],["d6","d7d6",""],["d4","d2d4","The ideal centre: pawns on e4 and d4 with all your pieces ready."]],"id":"italian-4"},{"name":"4...d6 lets d4 in","summary":"When Black doesn't attack e4, grab the full centre with d4.","moves":[["e4","e2e4","Takes the centre and opens lines for the queen and the f1 bishop."],["e5","e7e5","Black claims the same central space."],["Nf3","g1f3","Develops and attacks e5 straight away."],["Nc6","b8c6","Defends e5 while developing."],["Bc4","f1c4","The Italian bishop. It eyes f7, which only the black king defends."],["Bc5","f8c5","The Giuoco Piano: Black copies and aims at f2."],["c3","c2c3","Prepares d4 and takes the d4 square away from Black's knight."],["d6","d7d6","Passive. Nothing is hitting e4."],["d4","d2d4","With e4 safe, build the big centre right now."],["exd4","e5d4",""],["cxd4","c3d4","Two pawns side by side on e4 and d4: the dream centre."],["Bb6","c5b6",""],["Nc3","b1c3","Develops and guards both e4 and the d5 square."]],"id":"italian-5"},{"name":"Legal's Mate","summary":"Pin your knight too early and ...Bh5? allows a queen sacrifice that ends in mate.","trap":true,"moves":[["e4","e2e4","Takes the centre and opens lines for the queen and the f1 bishop."],["e5","e7e5","Black claims the same central space."],["Nf3","g1f3","Develops and attacks e5 straight away."],["Nc6","b8c6","Defends e5 while developing."],["Bc4","f1c4","The Italian bishop. It eyes f7, which only the black king defends."],["d6","d7d6","Passive. Black lets you develop freely."],["Nc3","b1c3","Develop and control d5."],["Bg4","c8g4","Pins your knight to the queen."],["h3","h2h3","Ask the bishop to decide."],["Bh5?","g4h5","Keeping the pin is the mistake. 5...Bxf3 was necessary."],["Nxe5!","f3e5","Ignore the pin. If Black takes your queen, it's mate. After 6...dxe5 7.Qxh5 you are simply a pawn up."],["Bxd1?","h5d1","Greedy, and fatal."],["Bxf7+","c4f7","The king has only one square."],["Ke7","e8e7",""],["Nd5#","c3d5","Legal's Mate: three minor pieces mate the king."]],"id":"italian-6"}]},{"id":"ruy","name":"Ruy Lopez","side":"w","eco":"C60–C99","about":"The Ruy Lopez (Spanish) attacks the knight that defends e5. It does not win a pawn right away, but the pressure lasts for many moves. White aims for c3 and d4, a long-term grip on the centre, and the knight trip Nbd2–f1–g3. It is the most classical opening there is.","plans":["Keep the bishop on the a2–g8 diagonal after ...a6 and ...b5. It eyes f7.","Build a pawn centre with c3 and d4.","Play h3 before d4 so ...Bg4 can't pressure d4.","Reroute the knight Nbd2–f1–g3 toward the kingside."],"lines":[{"name":"Closed Chigorin","summary":"The main road: ...a6, ...Nf6, ...Be7, ...b5, ...d6, then c3, h3 and d4.","moves":[["e4","e2e4","Takes the centre and frees the queen and the f1 bishop."],["e5","e7e5",""],["Nf3","g1f3","Develops and attacks e5."],["Nc6","b8c6",""],["Bb5","f1b5","The Spanish bishop attacks the knight that defends e5."],["a6","a7a6","The Morphy Defence: Black asks the bishop at once."],["Ba4","b5a4","Keep the pressure. 4.Bxc6 is the Exchange Variation."],["Nf6","g8f6","Develops and hits e4."],["O-O","e1g1","Castle. If ...Nxe4, Re1 and d4 win the pawn back with interest."],["Be7","f8e7","Black prepares to castle."],["Re1","f1e1","Now e4 is defended, and Bxc6 followed by Nxe5 is a real threat."],["b5","b7b5","Black breaks the pin by kicking the bishop."],["Bb3","a4b3","The bishop keeps aiming at f7 from its new home."],["d6","d7d6","Firmly supports e5."],["c3","c2c3","Gives the bishop a retreat to c2 and prepares d4."],["O-O","e8g8",""],["h3","h2h3","Stops ...Bg4 before you play d4."],["Na5","c6a5","The Chigorin: Black hunts the strong bishop."],["Bc2","b3c2","Keep it. On c2 it still points at the kingside."],["c5","c7c5","Black grabs queenside space and hits d4."],["d4","d2d4","Take the centre. A classic Ruy tension position."],["Qc7","d8c7","Adds support to e5."],["Nbd2","b1d2","Starts the famous Nd2–f1–g3 manoeuvre."]],"id":"ruy-0"},{"name":"Marshall Attack","summary":"Black gives a pawn with 8...d5. Know the main line by heart.","moves":[["e4","e2e4","Takes the centre and frees the queen and the f1 bishop."],["e5","e7e5",""],["Nf3","g1f3","Develops and attacks e5."],["Nc6","b8c6",""],["Bb5","f1b5","The Spanish bishop attacks the knight that defends e5."],["a6","a7a6","The Morphy Defence: Black asks the bishop at once."],["Ba4","b5a4","Keep the pressure. 4.Bxc6 is the Exchange Variation."],["Nf6","g8f6","Develops and hits e4."],["O-O","e1g1","Castle. If ...Nxe4, Re1 and d4 win the pawn back with interest."],["Be7","f8e7","Black prepares to castle."],["Re1","f1e1","Now e4 is defended, and Bxc6 followed by Nxe5 is a real threat."],["b5","b7b5","Black breaks the pin by kicking the bishop."],["Bb3","a4b3","The bishop keeps aiming at f7 from its new home."],["O-O","e8g8","Castling first hints at the Marshall."],["c3","c2c3","Our standard move. Now ...d5 is the Marshall gambit."],["d5","d7d5","Black gives a pawn for a fast kingside attack."],["exd5","e4d5","Accept. Declining gives Black easy play."],["Nxd5","f6d5",""],["Nxe5","f3e5","Take a second pawn too. This is the main line."],["Nxe5","c6e5",""],["Rxe5","e1e5","White is a pawn up. Now you must defend carefully."],["c6","c7c6","Supports the d5 knight and prepares ...Bd6."],["d4","d2d4","Develops the c1 bishop's diagonal and prepares Re1."],["Bd6","e7d6","Hits the rook with tempo and aims at h2."],["Re1","e5e1","Retreat to safety."],["Qh4","d8h4","The queen joins the attack."],["g3","g2g3","Blocks the queen and shields h2."],["Qh3","h4h3",""],["Be3","c1e3","Develops and covers the dark squares."],["Bg4","c8g4","Hits your queen."],["Qd3","d1d3","Defends and keeps an eye on the kingside."],["Rae8","a8e8",""],["Nd2","b1d2","Brings the last piece into defence. Theory says White holds."]],"id":"ruy-1"},{"name":"Berlin Defence ."],["Bc5","f8c5","The Classical: an active bishop aims at f2."],["O-O","e1g1","Castle first. 4.c3 is also fine."],["Nd4","c6d4","A common idea: trade knights."],["Nxd4","f3d4","Trade knights. Black's bishop must take back and will be kicked by c3."],["Bxd4","c5d4",""],["c3","c2c3","Kick the bishop with tempo."],["Bb6","d4b6",""],["d4","d2d4","Take the centre. White is comfortably better."]],"id":"ruy-6"},{"name":"Tarrasch Trap","summary":"In the Open Ruy, ...Qd7? lets you win the queen with a pin on the d-file.","trap":true,"moves":[["e4","e2e4","Takes the centre and frees the queen and the f1 bishop."],["e5","e7e5",""],["Nf3","g1f3","Develops and attacks e5."],["Nc6","b8c6",""],["Bb5","f1b5","The Spanish bishop attacks the knight that defends e5."],["a6","a7a6","The Morphy Defence: Black asks the bishop at once."],["Ba4","b5a4","Keep the pressure. 4.Bxc6 is the Exchange Variation."],["Nf6","g8f6","Develops and hits e4."],["O-O","e1g1","Castle. If ...Nxe4, Re1 and d4 win the pawn back with interest."],["Nxe4","f6e4","The Open Variation: Black takes e4."],["d4","d2d4","Open the centre while Black's king is still in the middle."],["b5","b7b5",""],["Bb3","a4b3","Keep the bishop on the a2–g8 diagonal, pointing at f7 and d5."],["d5","d7d5","Black returns the pawn's worth with active pieces."],["dxe5","d4e5","Gain space on e5."],["Be6","c8e6",""],["c3","c2c3","Gives the bishop a retreat and builds a solid centre."],["Be7","f8e7","A solid alternative to 9...Bc5."],["Re1","f1e1","Pressure on the e4 knight."],["O-O","e8g8",""],["Nd4","f3d4","Eyes the e6 bishop and c6 knight."],["Qd7?","d8d7","Natural, but the queen now stands on the d-file facing yours."],["Nxe6","d4e6","Remove the e6 bishop first."],["fxe6","f7e6",""],["Rxe4!","e1e4","The d5 pawn can't recapture: it is pinned against the queen on d7."],["dxe4","d5e4",""],["Qxd7","d1d7","White wins the queen for a rook."]],"id":"ruy-7"},{"name":"Fishing Pole","summary":"Black puts a knight on g4 as bait. Taking it opens the ook."],["O-O","e8g8",""],["Bd3","f1d3","Set-up complete. The bishop aims at h7. Next: O-O, Qe2 or Ne5."]],"id":"london-0"},{"name":"2...c5 and ...Qb6","summary":"Meet the queen sortie on b2 with Qb3 and a queen trade.","moves":[["d4","d2d4","Takes the centre. The queen protects d4."],["d5","d7d5","Black takes an equal share."],["Bf4","c1f4","The London bishop, out before e3 can shut it in."],["c5","c7c5","An early strike at d4."],["e3","e2e3","Supports d4 and opens the f1 bishop. Same London set-up."],["Nc6","b8c6",""],["c3","c2c3","Calmly supports d4."],["Qb6","d8b6","Hits b2, which your bishop left behind."],["Qb3","d1b3","Offers a trade. Taking on b3 would open the a-file for your rook."],["c4","c5c4","Black kicks your queen."],["Qxb6","b3b6","Trade on your terms."],["axb6","a7b6",""],["Na3","b1a3","Heads for b5 to attack c7. Black's doubled b-pawns are a target."]],"id":"london-1"},{"name":"Transposing after 2...c5","summary":"4...Nf6 leads to the main set-up.","moves":[["d4","d2d4","Takes the centre. The queen protects d4."],["d5","d7d5","Black takes an equal share."],["Bf4","c1f4","The London bishop, out before e3 can shut it in."],["c5","c7c5","An early strike at d4."],["e3","e2e3","Supports d4 and opens the f1 bishop. Same London set-up."],["Nc6","b8c6",""],["c3","c2c3","Calmly supports d4."],["Nf6","g8f6","Black develops instead of ...Qb6."],["Nd2","b1d2","Keeps f3 free for the other knight and supports a future e4."],["e6","e7e6",""],["Ngf3","g1f3","Both knights out. The d4 pawn is rock solid."],["Bd6","f8d6","Black offers a bishop trade."],["Bg3","f4g3","Keep your bishop. If ...Bxg3, hxg3 opens the h-file for your rook."],["O-O","e8g8",""],["Bd3","f1d3","The same position as the main set-up."]],"id":"london-2"},{"name":"Symmetrical 2...Bf5","summary":"When Black copies, c4 and Qb3 hit b7.","moves":[["d4","d2d4","Takes the centre. The queen protects d4."],["d5","d7d5","Black takes an equal share."],["Bf4","c1f4","The London bishop, out before e3 can shut i tion for being solid, but it is full of active counterplay. The pawn structure stays healthy and the endgames are often good for Black.","plans":["Develop the c8 bishop to f5 or g4 BEFORE playing ...e6.","Break with ...c5 against the Advance; finish with ...Nd7, ...Ngf6 and ...e6 in the Classical.","In the Classical, meet h4 with ...h6 so the bishop always has h7.","Castle long or short depending on where White's king goes."],"lines":[{"name":"Classical 4...Bf5","summary":"The main line: ...Bf5, ...Bg6, ...h6, ...Nd7.","moves":[["e4","e2e4",""],["c6","c7c6","Prepares ...d5 with full support."],["d4","d2d4",""],["d5","d7d5","Challenge e4 right away."],["Nc3","b1c3",""],["dxe4","d5e4","Give up the centre to free your pieces."],["Nxe4","c3e4",""],["Bf5","c8f5","Develop the \"problem\" bishop with tempo on the knight."],["Ng3","e4g3",""],["Bg6","f5g6","Keep the bishop on the diagonal."],["h4","h2h4",""],["h6","h7h6","Make room on h7 so h5 never traps the bishop."],["Nf3","g1f3",""],["Nd7","b8d7","Stops Ne5, which would attack g6."],["h5","h4h5",""],["Bh7","g6h7","The bishop's safe square, which ...h6 made for it."],["Bd3","f1d3",""],["Bxd3","h7d3","Trade off White's best attacking piece."],["Qxd3","d1d3",""],["e6","e7e6","Now ...e6 is fine. The bishop is already out."],["Bd2","c1d2",""],["Ngf6","g8f6","Develop. f6 is the knight's natural square."],["O-O-O","e1c1",""],["Be7","f8e7","Solid. Black can castle short or play ...Qc7 and ...O-O-O."]],"id":"caro-0"},{"name":"Classical via 6.Nf3","summary":"Same structure if White delays h4.","moves":[["e4","e2e4",""],["c6","c7c6","Prepares ...d5 with full support."],["d4","d2d4",""],["d5","d7d5","Challenge e4 right away."],["Nc3","b1c3",""],["dxe4","d5e4","Give up the centre to free your pieces."],["Nxe4","c3e4",""],["Bf5","c8f5","Develop the \"problem\" bishop with tempo on the knight."],["Ng3","e4g3",""],["Bg6","f5g6","Keep the bishop on the diagonal."],["Nf3","g1f3",""],["Nd7","b8d7","Again stops Ne5."],["h4","h2h4",""],["h6" const cloud = {
  ref: null, timer: 0, writing: false, dirty: false,

// ---------- spaced repetition ----------
const INTERVALS = [0, 1, 3, 7, 14, 30, 60, 120, 240]; // days, by stage
function lineStatus(id, now = Date.now()) {
  const st = S.lines[id];
  if (!st) return 'new';
  if (st.due <= now) return 'due';
  return st.stage >= 4 ? 'strong' : 'learning';
}
function dueLabel(id) {
  const st = S.lines[id];
  if (!st) return 'New';
  const d = st.due - Date.now();
  if (d <= 0) return 'Due now';
  if (d < 3600e3) return `in ${Math.max(1, Math.round(d / 60e3))} min`;
  if (d < DAY) return `in ${Math.round(d / 3600e3)} h`;
  return `in ${Math.round(d / DAY)} d`;
}
function grade(id, perfect, mode) {
  const now = Date.now();
  const jitter = 0.9 + Math.random() * 0.2;
  let st = S.lines[id];
  if (mode === 'learn') {
    st = { stage: perfect ? 1 : 0, due: now + (perfect ? DAY : 4 * 3600e3), reps: 1, lapses: 0, last: now };
  } else {
    st = st ? { ...st } : { stage: 0, due: now, reps: 0, lapses: 0 };
    const wasDue = st.due <= now + 6 * 3600e3;
    if (perfect) {
      if (wasDue || st.stage === 0) st.stage = Math.min(st.stage + 1, INTERVALS.length - 1);
      st.due = now + INTERVALS[Math.max(1, st.stage)] * DAY * jitter;
    } else {
      st.lapses = (st.lapses || 0) + 1;
      st.stage = Math.max(1, st.stage - 2);
      st.due = now + 0.5 * DAY;
    }
    st.reps = (st.reps || 0) + 1;
    st.last = now;
  }
  S.lines[id] = st;
  const t = todayStr();
  S.days[t] = (S.days[t] || 0) + 1;
  save();
  return st;
}
function nextReviewText(st) {
  const d = st.due - Date.now();
  if (d < DAY * 0.9) return `in ${Math.max(1, Math.round(d / 3600e3))} hours`;
  const days = Math.round(d / DAY);
  return days === 1 ? 'tomorrow' : `in ${days} days`;
}
function opStats(op, list = op.lines) {
  const now = Date.now();
  let strong = 0, learning = 0, due = 0, fresh = 0, score = 0;
  for (const l of list) {
    const s = lineStatus(l.id, now);
    if (s === 'new') fresh++; else if (s === 'strong') strong++; else learning++;
    if (s === 'due') due++;
    const st = S.lines[l.id];
    if (st) score += Math.min(st.stage, 5) / 5;
  }
  return { strong, learning, due, fresh, total: list.length, mastery: list.length ? score / list.length : 0 };
}
function streak() {
  let n = 0;
  const d = new Date();
  if (!S.days[todayStr(d)]) d.setDate(d.getDate() - 1);
  while (S.days[todayStr(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const DAILY_GOAL = 5;
function level(xp = S.xp) {
  const L = Math.floor(Math.sqrt(xp / 100)) + 1;
  const lo = 100 * (L - 1) ** 2, hi = 100 * L ** 2;
  return { L, frac: (xp - lo) / (hi - lo), toNext: hi - xp };
}
function recordWeak(lineId, ply) {
  const k = lineId + '|' + ply;
  const w = S.weak[k] || { c: 0 };
  w.c = Math.min(w.c + 1, 5);
  w.t = Date.now();

  const keys = Object.keys(S.weak);
  if (keys.length > 150) {
    keys.sort((a, b) => S.weak[a].t - S.weak[b].t).slice(0, keys.length - 150).forEach(k2 => delete S.weak[k2]);

}

    .filter(x => LINES[x.lineId] && LINES[x.lineId].moves[x.ply])

const Sound = {
  ctx: null,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, { type = 'sine', vol = 0.12, at = 0 } = {}) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  knock(freq, vol) {
    const c = this.ctx; if (!c) return;
    const len = Math.floor(c.sampleRate * 0.07);

    const data = buf.getChannelData(0);

    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2; g.gain.value = vol;
    src.connect(f).connect(g).connect(c.destination);
    src.start();
  },
  /** A soft wooden tock: a short sine that drops a little in pitch, plus a muffled click. */
  tock(freq, vol, at = 0) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = 'sine'; o.frequency.setValueAtTime(freq * 1.35, t); o.frequency.exponentialRampToValueAtTime(freq, t + 0.03);
    lp.type = 'lowpass'; lp.frequency.value = 1800;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(lp).connect(g).connect(c.destination); o.start(t); o.stop(t + 0.2);
    const len = Math.floor(c.sampleRate * 0.025), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 6;

    n.connect(f).connect(ng).connect(c.destination); n.start(t);
  },
  play(kind) {
    if (!S.settings.sound || !this.ensure()) return;
    if (kind === 'move') this.tock(300, 0.22);
    else if (kind === 'capture') { this.tock(240, 0.26); this.tock(340, 0.12, 0.035); }
    else if (kind === 'good') { this.tone(660, 0.18, { vol: 0.045 }); this.tone(990, 0.26, { vol: 0.04, at: 0.08 }); }
    else if (kind === 'bad') { this.tone(247, 0.22, { vol: 0.06 }); this.tone(220, 0.26, { vol: 0.05, at: 0.08 }); }
    else if (kind === 'done') [523, 659, 784].forEach((f, i) => this.tone(f, 0.36, { vol: 0.045, at: i * 0.09 }));
  },
};
