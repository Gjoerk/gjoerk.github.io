<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kingsfall</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #10140f; color: #e8e2d0;
      font: 14px/1.4 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
    canvas#game { display: block; width: 100vw; height: 100vh; cursor: crosshair; image-rendering: pixelated; }
    .bar { position: fixed; left: 0; right: 0; background: #1d1a14; border: 0 solid #5a4a2a; pointer-events: none; }
    #top { top: 0; padding: 6px 12px; border-bottom-width: 2px; display: flex; gap: 18px; align-items: center; }
    #bottom { bottom: 0; height: 132px; border-top-width: 2px; display: flex; justify-content: space-between; }
    #selection { padding: 10px 14px; }
    #minimap { margin: 6px; border: 2px solid #5a4a2a; pointer-events: auto; cursor: pointer; image-rendering: pixelated; }
    .chip { display: inline-block; width: 10px; height: 10px; margin-right: 5px; }
    #lobby { position: fixed; inset: 0; display: grid; place-items: center; background: #10140f; }
    #lobby form { display: grid; gap: 10px; width: min(320px, calc(100vw - 32px)); padding: 24px;
      border: 2px solid #5a4a2a; background: #1d1a14; }
    #lobby h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .12em; color: #e0c12f; }
    #lobby input, #lobby button { font: inherit; padding: 8px 10px; border: 1px solid #5a4a2a; background: #10140f; color: inherit; }
    #lobby button { background: #e0c12f; color: #10140f; font-weight: 700; cursor: pointer; }
    #lobby-msg { min-height: 1.4em; color: #e07a5f; margin: 0; }
    .dim { color: #9a927c; }
  </style>
  <script type="module" crossorigin src="./assets/index-CInSPh1R.js"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="top" class="bar" hidden>
    <span>Room <b id="room-code"></b></span>
    <span id="players"></span>
    <span class="dim" style="margin-left:auto">Drag: select · Right-click: move · WASD: scroll</span>
  </div>
  <div id="bottom" class="bar" hidden>
    <div id="selection"></div>
    <canvas id="minimap" width="120" height="120"></canvas>
  </div>
  <div id="lobby">
    <form id="lobby-form" autocomplete="off">
      <h1>KINGSFALL</h1>
      <input id="name" placeholder="Your name" maxlength="16" required>
      <input id="room" placeholder="Room code" maxlength="8">
      <button id="join-btn">Join game</button>
      <button id="host-btn">Host new game</button>
      <p class="dim" style="margin:0">The host's browser runs the game. It ends if the host closes the tab.</p>
      <p id="lobby-msg" role="status"></p>
    </form>
  </div>
</body>
</html>
